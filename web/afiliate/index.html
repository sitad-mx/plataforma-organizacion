<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud de afiliación · SITAD</title>
<link rel="icon" href="../assets/sitad-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header id="cabecera"></header>
<main class="contenido medio">
  <div id="vista"><p class="cargando">Cargando…</p></div>
</main>
<footer id="pie"></footer>
<script type="module">
import { sb, $, $$, esc, toast, ocupado, param, armazon, perfil, DOCS, DOCS_TRANSPORTE, docsRequeridos, DOC_NOMBRE, ESTADOS_MX, fecha, fechaLarga, fechaHoraLarga, hoy, subirArchivo, validarArchivo, rutaDocumento, ROOT, CFG } from '../assets/app.js';

const vista = $('#vista');
const campo = (id, label, extra = '', tipo = 'text', req = true) => `<div class="campo"><label for="${id}">${label}${req ? ' *' : ''}</label><input type="${tipo}" id="${id}" ${req ? 'required' : ''} ${extra}></div>`;
const slug = (param('s') || param('seccion') || '').toLowerCase().trim();
await armazon({ titulo: 'Solicitud de afiliación' });

if (!slug) {
  vista.innerHTML = `<div class="tarjeta"><h1>Necesitas la liga de tu Sección</h1><p>La solicitud de afiliación se hace desde la liga que te comparte la Secretaría de Organización de tu Sección Sindical. Así tu solicitud queda ligada a ella desde el primer día.</p><p>Si no la tienes, pídela a tu Sección o escribe a <a href="mailto:${CFG.CORREO_ORGANIZACION}">${CFG.CORREO_ORGANIZACION}</a> indicando tu ciudad o zona de operación.</p><p class="mt-2"><a class="btn secundario" href="${ROOT}estado/">Ya tengo folio: consultar mi trámite</a></p></div>`;
} else {
  const { data: secs, error } = await sb.rpc('seccion_publica', { p_slug: slug });
  const sec = secs && secs[0];
  if (error || !sec) {
    vista.innerHTML = `<div class="tarjeta"><h1>Esta liga no está activa</h1><p>La Sección indicada no existe o todavía no está habilitada para recibir solicitudes. Verifica la liga con tu Sección o escribe a <a href="mailto:${CFG.CORREO_ORGANIZACION}">${CFG.CORREO_ORGANIZACION}</a>.</p></div>`;
  } else {
    const p = await perfil();
    const modoSeccion = p && p.rol === 'seccion_organizacion' && p.secciones && p.secciones.slug === slug;
    const modoCEN = p && p.rol === 'cen_organizacion';
    render(sec, modoSeccion || modoCEN ? 'seccion' : 'publico', p);
  }
}


function render(sec, modo, p) {
  const enConstitucion = !!sec.asamblea_fecha_hora;
  vista.innerHTML = `
  <p class="muted small" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--rojo)">${esc(sec.denominacion)}${sec.numero ? ' · Sección ' + sec.numero : ''}</p>
  <h1>${modo === 'seccion' ? 'Registrar una solicitud recibida en la Sección' : 'Solicitud de afiliación'}</h1>
  <p class="entrada muted">${modo === 'seccion'
    ? `Estás registrando a nombre de la Sección (${esc(p.nombre || p.email)}). Captura los datos tal como vienen en la cédula y la solicitud firmadas, y sube los documentos que recibiste.`
    : 'Son los datos de la Cédula de afiliación (Anexo 23) y de la Manifestación de afiliación (Anexo 12 y 13). Con ellos el sistema te entrega los dos formatos prellenados para que los firmes. Todos los campos son obligatorios, salvo los que no apliquen a tu caso.'}</p>
  ${enConstitucion ? `<div class="aviso small"><b>Sección en constitución.</b> Con tu registro quedas inscrito(a) para participar en la <b>Asamblea Constitutiva</b> del ${esc(fechaHoraLarga(sec.asamblea_fecha_hora))}${sec.asamblea_direccion ? ', en ' + esc(sec.asamblea_direccion) : ''}.</div>` : ''}

  <form id="forma" class="tarjeta mt-2" novalidate>
    <fieldset>
      <legend>Tipo de movimiento</legend>
      <div class="opciones"><label><input type="radio" name="tipo_movimiento" value="Alta" checked> Alta (primera afiliación)</label><label><input type="radio" name="tipo_movimiento" value="Modificación"> Modificación de datos</label></div>
    </fieldset>

    <fieldset>
      <legend>Información general del trabajador</legend>
      ${campo('nombre', 'Nombre completo (como aparece en tu identificación)', 'autocomplete="name"')}
      <div class="fila">${campo('fnac', 'Fecha de nacimiento', '', 'date')}
        <div class="campo"><label for="estado_civil">Estado civil *</label><select id="estado_civil" required><option value="">Elige…</option><option>Soltero(a)</option><option>Casado(a)</option><option>Unión libre</option><option>Divorciado(a)</option><option>Viudo(a)</option></select></div></div>
      <div class="fila">${campo('rfc', 'R.F.C.', 'maxlength="13" style="text-transform:uppercase"')}${campo('curp', 'CURP', 'maxlength="18" style="text-transform:uppercase" placeholder="18 caracteres"')}</div>
      <div class="campo"><label>Género *</label><div class="opciones"><label><input type="radio" name="genero" value="Mujer"> Mujer</label><label><input type="radio" name="genero" value="Hombre"> Hombre</label></div></div>
      ${campo('domicilio', 'Domicilio (calle y número)', 'autocomplete="street-address"')}
      <div class="fila">${campo('colonia', 'Colonia')}${campo('cp', 'C.P.', 'maxlength="5" inputmode="numeric"')}</div>
      <div class="fila">${campo('municipio', 'Ciudad o municipio')}
        <div class="campo"><label for="estado_dom">Estado *</label><select id="estado_dom" required><option value="">Elige…</option>${ESTADOS_MX.map(e => `<option ${e === sec.entidad ? 'selected' : ''}>${e}</option>`).join('')}</select></div></div>
      <div class="fila">${campo('correo', 'E-mail', 'autocomplete="email"', 'email')}${campo('tel', 'Celular (WhatsApp)', 'autocomplete="tel" placeholder="10 dígitos"', 'tel')}</div>
      <span class="ayuda">Al correo te llegará tu folio y los avisos del trámite.</span>
    </fieldset>

    <fieldset>
      <legend>Seguridad social</legend>
      ${campo('nss', 'NSS (número de seguridad social)', 'maxlength="11" inputmode="numeric"')}
      <div class="fila">${campo('unidad_medica', 'Unidad médica')}${campo('unidad_medica_ciudad', 'Ciudad de la unidad médica')}</div>
      <span class="ayuda">Si no tienes NSS, escribe "Sin NSS".</span>
    </fieldset>

    <fieldset>
      <legend>Situación profesional</legend>
      <div class="fila">${campo('escolaridad', 'Escolaridad', 'placeholder="p. ej. Preparatoria, Licenciatura"')}
        <div class="campo"><label>¿Trunca o concluida? *</label><div class="opciones"><label><input type="radio" name="escolaridad_estado" value="Concluida"> Concluida</label><label><input type="radio" name="escolaridad_estado" value="Trunca"> Trunca</label></div></div></div>
      ${campo('carrera', 'Carrera', 'placeholder="Si no aplica, escribe: No aplica"')}
    </fieldset>

    <fieldset>
      <legend>Información de la empresa</legend>
      ${campo('puesto', 'Ocupación', 'placeholder="p. ej. conductor(a) de plataforma digital, repartidor(a)"')}
      <div class="fila">${campo('empresa', 'Empresa', 'value="REEDCAM"')}${campo('finicio', 'Ingreso (fecha de ingreso)', '', 'date')}</div>
      <div class="fila">${campo('domicilio_fiscal', 'Domicilio fiscal (de tu constancia del SAT)')}${campo('frecuencia', 'Frecuencia de pago', 'placeholder="p. ej. semanal, quincenal"')}</div>
      <div class="fila">${campo('tel_empresa', 'Teléfono de la empresa o zona')}${campo('jefe', 'Jefe laboral o contacto')}</div>
      ${campo('centro', 'Centro de trabajo o zona de operación', '', 'text', false)}
      <div class="campo"><label>¿Tu actividad es transporte de pasajeros o última milla (reparto)? *</label>
        <div class="opciones"><label><input type="radio" name="transporte" value="no" checked> No</label><label><input type="radio" name="transporte" value="si"> Sí</label></div>
        <span class="ayuda">Si es sí, el expediente lleva tres documentos más: tarjeta de circulación, póliza de seguro y licencia de manejo.</span></div>
      <div class="campo"><label>¿Desempeñas funciones de confianza (dirección, inspección, vigilancia o fiscalización de carácter general)? *</label>
        <div class="opciones"><label><input type="radio" name="confianza" value="no" checked> No</label><label><input type="radio" name="confianza" value="si"> Sí</label></div></div>
    </fieldset>

    <fieldset>
      <legend>Seguro del instrumento de trabajo</legend>
      <p class="small muted">Vehículo, moto, bicicleta, equipo. Si no tienes seguro, escribe "Sin seguro" en el primer campo.</p>
      ${campo('seguro', 'Seguro (aseguradora)')}
      <div class="fila">${campo('poliza', 'Póliza o número de afiliación', '', 'text', false)}${campo('vigencia', 'Vigencia', 'placeholder="p. ej. 31/12/2026"', 'text', false)}</div>
    </fieldset>

    <fieldset>
      <legend>Información del cónyuge</legend>
      <label class="casilla"><input type="checkbox" id="sin_conyuge"> <span>No tengo cónyuge</span></label>
      <div id="bloque-conyuge" class="mt-2">${campo('conyuge_nombre', 'Nombre')}<div class="fila">${campo('conyuge_domicilio', 'Domicilio')}${campo('conyuge_tel', 'Teléfono', '', 'tel')}</div></div>
    </fieldset>

    <fieldset>
      <legend>Dependientes (hasta tres)</legend>
      <label class="casilla"><input type="checkbox" id="sin_dependientes"> <span>No tengo dependientes</span></label>
      <div id="bloque-dep" class="mt-2">${[1, 2, 3].map(i => `<div class="fila"><div class="campo"><label for="dep${i}_nombre">Nombre${i === 1 ? ' *' : ''}</label><input type="text" id="dep${i}_nombre"></div><div class="campo"><label for="dep${i}_par">Parentesco</label><input type="text" id="dep${i}_par" placeholder="hijo(a), madre…"></div><div class="campo"><label for="dep${i}_edad">Edad</label><input type="number" id="dep${i}_edad" min="0" max="120"></div></div>`).join('')}</div>
    </fieldset>

    <fieldset>
      <legend>Manifestación de afiliación (Anexo 12)</legend>
      <div class="fila">${campo('identificacion_tipo', 'Me identifico con', 'value="Credencial para votar (INE)" placeholder="p. ej. Credencial para votar (INE), pasaporte"')}${campo('patron', 'Patrón', 'value="REEDCAM"')}</div>
      ${campo('ciudad_firma', 'Ciudad donde firmas', `value="${esc(sec.sede || sec.entidad)}"`)}
      <p class="small">Al firmar la manifestación declaras, bajo protesta de decir verdad, que desarrollas actividades económicas mediante plataformas digitales; que solicitas tu afiliación de manera libre, personal, voluntaria e informada; que aceptas cubrir las cuotas sindicales; que recibiste información sobre los fines, Estatutos, derechos y obligaciones del SITAD; que te comprometes a cumplir sus Estatutos y acuerdos; y que autorizas tu incorporación al padrón y el tratamiento de tus datos. El texto completo lo verás en el documento que te entregamos para firmar.</p>
      <label class="casilla"><input type="checkbox" id="acepta"> <span><b>Acepto los Estatutos y Documentos Básicos de la Organización.</b> *</span></label>
      <label class="casilla mt-1"><input type="checkbox" id="aviso"> <span><b>Estoy de acuerdo con el <a href="#" id="ver-aviso">Aviso de Privacidad</a></b> y otorgo mi consentimiento expreso para el tratamiento de mis datos personales. *</span></label>
      <div id="texto-aviso" class="oculto aviso small mt-2">
        <b>AVISO DE PRIVACIDAD CON CONSENTIMIENTO EXPRESO.</b> El Sindicato de Trabajadores Digitales (SITAD), con domicilio en ${CFG.DOMICILIO_SG}, teléfono para contacto ${CFG.TELEFONO_CONTACTO}, correo electrónico ${CFG.CORREO_FINANZAS}, es responsable del tratamiento de los datos personales que sean proporcionados por las personas afiliadas, mismos que serán protegidos conforme a lo establecido en la Ley Federal de Protección de Datos Personales en Posesión de los Particulares y demás disposiciones aplicables.<br>
        Los datos personales recabados serán utilizados exclusivamente para finalidades relacionadas con: el proceso de afiliación sindical; la integración y actualización del padrón de personas afiliadas; la administración de la relación sindical; la comunicación institucional; la prestación de servicios y beneficios sindicales; el cumplimiento de obligaciones legales y estatutarias.<br>
        Mediante la firma del documento, la persona titular manifiesta su consentimiento expreso para el tratamiento de sus datos personales conforme a las finalidades señaladas. Asimismo, podrá ejercer sus derechos de Acceso, Rectificación, Cancelación u Oposición (derechos ARCO) mediante solicitud presentada ante el domicilio del Sindicato o por los medios que para tal efecto establezca la organización.
      </div>
    </fieldset>

    <fieldset>
      <legend>Documentos del expediente</legend>
      <p class="small muted">Los dos primeros (solicitud y cédula) <b>te los entrega el sistema prellenados al enviar</b>: los imprimes, los firmas de puño y letra y los subes en "Consultar mi trámite". Los demás puedes subirlos ahora. PDF, JPG o PNG, máximo 5 MB cada uno.</p>
      <div id="docs-base">${DOCS.filter(d => !['solicitud', 'cedula'].includes(d.tipo)).map(d => `<div class="campo"><label for="f_${d.tipo}">${esc(d.nombre)}</label><input type="file" id="f_${d.tipo}" accept="application/pdf,image/jpeg,image/png"><span class="ayuda">${esc(d.ayuda || '')}</span></div>`).join('')}</div>
      <div id="docs-transporte" class="oculto">${DOCS_TRANSPORTE.map(d => `<div class="campo"><label for="f_${d.tipo}">${esc(d.nombre)}</label><input type="file" id="f_${d.tipo}" accept="application/pdf,image/jpeg,image/png"></div>`).join('')}</div>
      ${modo === 'seccion' ? `<div id="docs-firmados"><p class="small"><b>Si ya recibiste los formatos firmados</b>, súbelos aquí:</p>${DOCS.filter(d => ['solicitud', 'cedula'].includes(d.tipo)).map(d => `<div class="campo"><label for="f_${d.tipo}">${esc(d.nombre)}</label><input type="file" id="f_${d.tipo}" accept="application/pdf,image/jpeg,image/png"></div>`).join('')}</div>` : ''}
    </fieldset>

    <div id="errores" class="aviso error oculto"></div>
    <div class="acciones">
      <button class="btn" type="submit" id="enviar">${modo === 'seccion' ? 'Registrar solicitud' : 'Enviar mi solicitud'}</button>
      <span class="small muted">Al enviar se genera tu folio y tus formatos para firma.</span>
    </div>
  </form>`;

  $('#ver-aviso').onclick = e => { e.preventDefault(); $('#texto-aviso').classList.toggle('oculto'); };
  ['curp', 'rfc'].forEach(id => $('#' + id).addEventListener('input', e => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9&Ñ]/g, '')));
  $$('input[name=transporte]').forEach(r => r.onchange = () => $('#docs-transporte').classList.toggle('oculto', r.value !== 'si' || !r.checked));
  $('#sin_conyuge').onchange = e => { $('#bloque-conyuge').classList.toggle('oculto', e.target.checked); };
  $('#sin_dependientes').onchange = e => { $('#bloque-dep').classList.toggle('oculto', e.target.checked); };
  $('#forma').onsubmit = e => { e.preventDefault(); enviar(sec, modo, p); };
}

async function enviar(sec, modo, p) {
  const errores = []; const v = id => ($('#' + id) ? $('#' + id).value.trim() : '');
  const radio = n => (document.querySelector(`input[name=${n}]:checked`) || {}).value;
  const transporte = radio('transporte') === 'si';
  const obligatorios = [['nombre', 'Nombre completo'], ['fnac', 'Fecha de nacimiento'], ['estado_civil', 'Estado civil'], ['rfc', 'R.F.C.'], ['curp', 'CURP'], ['domicilio', 'Domicilio'], ['colonia', 'Colonia'], ['cp', 'C.P.'], ['municipio', 'Ciudad o municipio'], ['estado_dom', 'Estado'], ['correo', 'E-mail'], ['tel', 'Celular'],
    ['nss', 'NSS'], ['unidad_medica', 'Unidad médica'], ['unidad_medica_ciudad', 'Ciudad de la unidad médica'], ['escolaridad', 'Escolaridad'], ['carrera', 'Carrera'], ['puesto', 'Ocupación'], ['empresa', 'Empresa'], ['finicio', 'Fecha de ingreso'], ['domicilio_fiscal', 'Domicilio fiscal'], ['frecuencia', 'Frecuencia de pago'], ['tel_empresa', 'Teléfono de la empresa'], ['jefe', 'Jefe laboral'], ['seguro', 'Seguro'], ['identificacion_tipo', 'Identificación'], ['patron', 'Patrón'], ['ciudad_firma', 'Ciudad donde firmas']];
  for (const [id, n] of obligatorios) if (!v(id)) errores.push(`Falta: ${n}.`);
  if (!radio('genero')) errores.push('Indica tu género.');
  if (!radio('escolaridad_estado')) errores.push('Indica si tu escolaridad está trunca o concluida.');
  const correo = v('correo').toLowerCase(), curp = v('curp'), rfc = v('rfc');
  if (correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)) errores.push('El correo no es válido.');
  if (v('tel') && v('tel').replace(/\D/g, '').length < 10) errores.push('El celular debe tener 10 dígitos.');
  if (curp && !/^[A-Z]{4}[0-9]{6}[HM][A-Z]{5}[0-9A-Z][0-9]$/.test(curp)) errores.push('La CURP no tiene el formato correcto (18 caracteres).');
  if (rfc && !/^[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}$/.test(rfc)) errores.push('El R.F.C. no tiene el formato correcto (12 o 13 caracteres).');
  if (!$('#sin_conyuge').checked && !v('conyuge_nombre')) errores.push('Escribe el nombre de tu cónyuge o marca "No tengo cónyuge".');
  const dependientes = [];
  if (!$('#sin_dependientes').checked) { for (const i of [1, 2, 3]) { const n = v(`dep${i}_nombre`); if (n) dependientes.push({ nombre: n, parentesco: v(`dep${i}_par`), edad: v(`dep${i}_edad`) ? Number(v(`dep${i}_edad`)) : null }); } if (!dependientes.length) errores.push('Escribe al menos un dependiente o marca "No tengo dependientes".'); }
  if (!$('#acepta').checked) errores.push('Es necesario aceptar los Estatutos y Documentos Básicos.');
  if (!$('#aviso').checked) errores.push('Es necesario aceptar el Aviso de Privacidad.');
  const archivos = [];
  for (const d of [...DOCS, ...(transporte ? DOCS_TRANSPORTE : [])]) { const inp = $('#f_' + d.tipo); const f = inp && inp.files[0]; if (f) { const err = validarArchivo(f); if (err) errores.push(`${d.corto}: ${err}`); else archivos.push({ tipo: d.tipo, f }); } }
  const caja = $('#errores');
  if (errores.length) { caja.classList.remove('oculto'); caja.innerHTML = '<b>Revisa lo siguiente:</b><ul>' + errores.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>'; caja.scrollIntoView({ behavior: 'smooth' }); return; }
  caja.classList.add('oculto');

  const datos = {
    tipo_movimiento: radio('tipo_movimiento') || 'Alta', nombre_completo: v('nombre'), fecha_nacimiento: v('fnac'), estado_civil: v('estado_civil'), rfc, curp, genero: radio('genero'),
    domicilio: v('domicilio'), colonia: v('colonia'), cp: v('cp'), municipio: v('municipio'), estado_domicilio: v('estado_dom'), correo, telefono: v('tel'),
    nss: v('nss'), unidad_medica: v('unidad_medica'), unidad_medica_ciudad: v('unidad_medica_ciudad'),
    escolaridad: v('escolaridad'), escolaridad_estado: radio('escolaridad_estado'), carrera: v('carrera'),
    puesto: v('puesto'), empresa: v('empresa'), fecha_inicio_relacion: v('finicio'), domicilio_fiscal: v('domicilio_fiscal'), frecuencia_pago: v('frecuencia'), telefono_empresa: v('tel_empresa'), jefe_laboral: v('jefe'), centro_trabajo: v('centro') || v('municipio'),
    seguro_aseguradora: v('seguro'), seguro_poliza: v('poliza'), seguro_vigencia: v('vigencia'),
    conyuge_nombre: $('#sin_conyuge').checked ? null : v('conyuge_nombre'), conyuge_domicilio: $('#sin_conyuge').checked ? null : v('conyuge_domicilio'), conyuge_telefono: $('#sin_conyuge').checked ? null : v('conyuge_tel'),
    dependientes, identificacion_tipo: v('identificacion_tipo'), patron: v('patron'), actividad_transporte: transporte, es_confianza: radio('confianza') === 'si', ciudad_firma: v('ciudad_firma'),
    acepta_estatuto: true, acepta_aviso: true,
  };
  const btn = $('#enviar'); ocupado(btn, true, 'Enviando…');
  let folio, idSol;
  try {
    if (modo === 'seccion') {
      const { acepta_aviso, ...fila } = datos;
      const { data, error } = await sb.from('solicitudes_afiliacion').insert({ ...fila, seccion_id: (await idSeccion(sec.slug)), canal: 'seccion', acepta_estatuto: true, acepta_estatuto_at: new Date().toISOString(), aviso_privacidad_at: new Date().toISOString(), fecha_nacimiento: fila.fecha_nacimiento || null, fecha_inicio_relacion: fila.fecha_inicio_relacion || null }).select('id, folio').single();
      if (error) throw error; folio = data.folio; idSol = data.id;
    } else {
      const { data, error } = await sb.rpc('crear_solicitud_publica_v2', { p_slug: sec.slug, p_datos: datos });
      if (error) throw error; folio = data[0].folio;
    }
  } catch (err) { ocupado(btn, false); toast('No se pudo enviar la solicitud: ' + (err.message || err), 'error'); return; }

  const subidos = [], fallidos = [];
  for (const a of archivos) {
    try {
      const ruta = rutaDocumento(sec.slug, folio, a.tipo, a.f.name); await subirArchivo(ruta, a.f);
      if (modo === 'seccion') { const { error } = await sb.from('solicitud_documentos').insert({ solicitud_id: idSol, tipo: a.tipo, archivo_url: ruta, nombre_archivo: a.f.name }); if (error) throw error; }
      else { const { error } = await sb.rpc('registrar_documento_publico', { p_folio: folio, p_correo: correo, p_tipo: a.tipo, p_archivo_url: ruta, p_nombre_archivo: a.f.name }); if (error) throw error; }
      subidos.push(a.tipo);
    } catch (err) { fallidos.push(a.tipo + ': ' + (err.message || err)); }
  }
  const req = docsRequeridos(transporte); const faltan = req.filter(d => !subidos.includes(d.tipo));
  const q = `f=${encodeURIComponent(folio)}&c=${encodeURIComponent(correo)}`;
  vista.innerHTML = `
    <div class="tarjeta">
      <p class="muted small" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--verde)">Solicitud recibida</p>
      <h1>Tu folio es <span class="rojo">${esc(folio)}</span></h1>
      <p>${modo === 'seccion' ? 'La solicitud quedó registrada a nombre de la Sección.' : `Guárdalo. Con él y tu correo (<b>${esc(correo)}</b>) consultas tu trámite y subes tus documentos.`} Fecha de recepción: <b>${fechaLarga(hoy())}</b>.</p>
      <div class="aviso"><b>Siguiente paso: firma tus dos formatos.</b> Descárgalos ya prellenados con tus datos, imprímelos, fírmalos de puño y letra (la solicitud lleva dos firmas: manifestación y aviso de privacidad) y súbelos en "Consultar mi trámite".
        <div class="acciones"><a class="btn" href="${ROOT}documento.html?tipo=solicitud&${q}" target="_blank">Solicitud de afiliación (Anexo 12 y 13)</a><a class="btn" href="${ROOT}documento.html?tipo=cedula&${q}" target="_blank">Cédula de afiliación (Anexo 23)</a></div></div>
      ${subidos.length ? `<div class="aviso ok"><b>Documentos recibidos (${subidos.length} de ${req.length}):</b> ${subidos.map(t => esc(DOC_NOMBRE[t])).join(' · ')}</div>` : ''}
      ${faltan.length ? `<div class="aviso atencion"><b>Faltan ${faltan.length} documento(s):</b> ${faltan.map(d => esc(d.corto)).join(' · ')}.<br>Súbelos en <a href="${ROOT}estado/?${q}">Consultar mi trámite</a>. Si no llegan, la Secretaría te los pedirá una sola vez.</div>` : ''}
      ${fallidos.length ? `<div class="aviso error"><b>No se pudieron subir:</b> ${fallidos.map(esc).join('<br>')}. Inténtalo de nuevo desde Consultar mi trámite.</div>` : ''}
      <div class="acciones">
        <a class="btn secundario" href="${ROOT}estado/?${q}">Ver mi trámite y subir documentos</a>
        <button class="btn secundario" onclick="window.print()">Imprimir este acuse</button>
        ${modo === 'seccion' ? `<a class="btn secundario" href="${ROOT}seccion/">Volver al portal de la Sección</a>` : ''}
      </div>
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function idSeccion(slug) { const { data } = await sb.from('secciones').select('id').eq('slug', slug).single(); return data.id; }
</script>
</body>
</html>
