<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento · SITAD</title>
<link rel="icon" href="assets/sitad-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header id="cabecera"></header>
<div class="barra-impresion"><button class="btn secundario chico" onclick="history.back()">Volver</button><button class="btn secundario chico" onclick="window.print()">Imprimir</button><button class="btn chico" id="descargar">⬇ Descargar PDF</button></div>
<div id="instrucciones-firma" class="contenido angosto oculto" style="padding-top:.5rem"></div>
<div id="doc"><p class="cargando" style="text-align:center">Preparando documento…</p></div>
<footer id="pie"></footer>
<script type="module">
import { sb, $, esc, toast, param, armazon, requerirRol, fecha, fechaLarga, fechaHoraLarga, hoy, dinero, DOCS, DOC_CORTO, docsRequeridos, ROOT, CFG } from './assets/app.js';
const tipo = param('tipo'), id = param('id'), f = param('f'), c = param('c'); const doc = $('#doc');
const publico = ['solicitud', 'cedula'].includes(tipo) && f && c;
let p = null;
if (!publico) { p = await requerirRol(['cen_organizacion', 'cen_lectura', 'sg', 'finanzas', 'seccion_organizacion', 'seccion_sg']); if (!p) throw new Error('sin acceso'); }
await armazon({ titulo: 'Documento' });

// Descarga directa en PDF (html2pdf); si falla, queda Imprimir → Guardar como PDF
const NOMBRES_PDF = { solicitud: 'Solicitud de afiliacion (Anexo 12 y 13)', cedula: 'Cedula de afiliacion (Anexo 23)', constancia: 'Constancia de Registro (Anexo 15)', gafete: 'Gafete (Anexo 14)', finanzas: 'Carta de Finanzas (AF-09)', dictamen: 'Dictamen FT-001', prevencion: 'Prevencion FT-002', credencial: 'Credencial', comprobante: 'Comprobante de cuota', convocatoria: 'Convocatoria a Asamblea Seccional (AS-01)', lista_corte: 'Padron al corte', asistencia: 'Lista de asistencia (AS-05)', quorum: 'Computo de quorum (AS-06)' };
$('#descargar').onclick = async () => {
  const btn = $('#descargar'); btn.disabled = true; btn.textContent = 'Preparando PDF…';
  try {
    if (!window.html2pdf) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    const nodo = doc.firstElementChild; const nombre = (NOMBRES_PDF[tipo] || 'Documento') + (f ? ' - ' + f : '') + '.pdf';
    await window.html2pdf().set({ margin: [10, 10, 12, 10], filename: nombre, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'letter', orientation: nodo.classList.contains('apaisado') ? 'landscape' : 'portrait' }, pagebreak: { mode: ['css', 'legacy'], before: '.salto' } }).from(nodo).save();
  } catch (e) { toast('No se pudo generar el PDF; usa Imprimir y elige "Guardar como PDF". ' + (e.message || ''), 'error'); }
  btn.disabled = false; btn.textContent = '⬇ Descargar PDF';
};
if (publico) {
  $('#instrucciones-firma').classList.remove('oculto');
  $('#instrucciones-firma').innerHTML = `<div class="aviso small"><b>Cómo firmar este documento.</b> 1) Descárgalo o imprímelo. 2) Fírmalo <b>con tinta azul</b>, igual que la firma de tu INE${tipo === 'solicitud' ? ', <b>en los dos lugares</b>: al final de la manifestación (hoja 3) y al final del aviso de privacidad (hoja 4)' : ', al final de la hoja 2'}. 3) Tómale foto o escanéalo y súbelo en "Consultar mi trámite" con tu folio y tu nombre. Sin firma insertada como imagen ni tachaduras.</div>`;
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const partes = d => { const [a, m, dd] = String(d || hoy()).slice(0, 10).split('-'); return { d: parseInt(dd), mes: MESES[parseInt(m) - 1], a }; };
const v = x => (x == null || x === '') ? '' : esc(x);
const LOGO = `${ROOT}assets/sitad-logo-cuadrado.png`;
// Membrete de los anexos del SG (tabla: logo · nombre y lema / título · caja derecha)
const sgMembrete = (titulo, derecha) => `<div class="sg-membrete"><div class="sg-logo"><img src="${LOGO}" alt=""></div><div class="sg-centro"><b>${CFG.SINDICATO_SG}</b><i>“${CFG.LEMA}”</i><span class="sg-titulo">${titulo}</span></div><div class="sg-derecha">${derecha.map(x => `<span>${x}</span>`).join('')}</div></div>`;
const membreteFT = (titulo) => `<div class="membrete"><img src="${ROOT}assets/sitad-logo-full.png" alt="SITAD"><div><b>${CFG.SINDICATO}</b><span>${CFG.SECRETARIA}</span><span class="lema">${CFG.LEMA}</span></div></div><h1>${titulo}</h1>`;
const pieFT = (formato) => `<div class="pie-doc">${formato} · Secretaría de Organización del Comité Ejecutivo Nacional · Versión 1.0 (septiembre 2026). ${CFG.CLAUSULA_PIE}<br>${CFG.DOMICILIO}</div>`;
const SI = (b) => b ? '☒ Sí ☐ No' : '☐ Sí ☒ No';
const fila2 = (a, b) => `<tr><td style="width:50%">${a}</td><td>${b}</td></tr>`;
const cel = (label, val) => `<b>${label}:</b> ${v(val)}`;

async function datosSolicitud() {
  if (publico) { const { data, error } = await sb.rpc('solicitud_publica_datos', { p_folio: f, p_correo: c }); if (error || !data) return null; return data; }
  const { data } = await sb.from('v_solicitudes').select('*').eq('id', id).single(); return data;
}
async function config() { const { data } = await sb.from('configuracion').select('clave, valor'); return Object.fromEntries((data || []).map(x => [x.clave, x.valor])); }

// ===================== Anexo 12 y 13 · Manifestación de afiliación + aviso de privacidad =====================
function anexo12(s) {
  const fe = partes(s.fecha_recepcion);
  const tabla = [['NOMBRE COMPLETO', s.nombre_completo], ['CURP', s.curp], ['CALLE', s.domicilio], ['COLONIA', s.colonia], ['C.P.', s.cp], ['MUNICIPIO', s.municipio], ['ESTADO', s.estado_domicilio], ['TELEFONO CELULAR', s.telefono], ['CORREO', s.correo], ['PATRON', s.patron || 'REEDCAM']];
  return `<div class="documento doc-sg sg-carta">
    <p style="text-align:right">Ciudad de <u>&nbsp;${v(s.ciudad_firma || s.municipio)}&nbsp;</u>, <u>&nbsp;${v(s.estado_domicilio)}&nbsp;</u>, a ${fe.d} de ${fe.mes} de ${fe.a}.</p>
    <p style="text-align:right"><b>ASUNTO:</b> Manifestación libre, personal,<br>voluntaria e informada de afiliación sindical</p>
    <p><b>Sindicato de Trabajadores Digitales<br>Secretaría de Organización<br>Presente</b></p>
    <p>Yo, <u>&nbsp;${v(s.nombre_completo)}&nbsp;</u>, mayor de edad, identificado(a) con <u>&nbsp;${v(s.identificacion_tipo || 'credencial para votar')}&nbsp;</u>, bajo protesta de decir verdad manifiesto lo siguiente:</p>
    <h4>PRIMERO.</h4><p>Que actualmente desarrollo actividades económicas mediante plataformas digitales y/o actividades relacionadas con la prestación de servicios a través de aplicaciones tecnológicas, incluyendo de manera enunciativa mas no limitativa servicios de transporte, reparto, logística, mensajería, comercio electrónico, servicios profesionales u otras modalidades vinculadas con las actividades económicas desarrolladas mediante plataformas digitales.</p>
    <h4>SEGUNDO.</h4><p>Que de manera libre, consciente, personal, voluntaria e informada, sin que medie presión, intimidación, engaño, promesa ilícita o cualquier forma de coacción, y con fundamento en los artículos 357 y 358, fracción I, de la Ley Federal del Trabajo, he decidido solicitar mi afiliación como integrante del <b>Sindicato de Trabajadores Digitales (SITAD).</b></p>
    <p>Asimismo, manifiesto mi aceptación para cubrir las cuotas sindicales establecidas en los Estatutos del Sindicato y autorizo que, en los casos en que exista una relación laboral o mecanismo administrativo que lo permita, se realicen las gestiones necesarias para su retención y entrega al SITAD conforme a la legislación aplicable.</p>
    <h4>TERCERO.</h4><p>Que reconozco que la libertad sindical constituye un derecho protegido por la Constitución Política de los Estados Unidos Mexicanos, los tratados internacionales de los que México forma parte y la Ley Federal del Trabajo, por lo que mi decisión de integrarme al SITAD deriva exclusivamente de mi voluntad personal, libre e informada.</p>
    <div class="salto"></div>
    <h4>CUARTO.</h4><p>Declaro haber recibido información suficiente respecto de:</p><ul><li>Los fines, objetivos y principios del SITAD.</li><li>Sus Estatutos.</li><li>Los derechos y obligaciones de las personas afiliadas.</li><li>La estructura democrática y organizativa del Sindicato.</li><li>Los procedimientos internos para la elección de sus órganos de representación.</li><li>Los mecanismos de participación, consulta y rendición de cuentas.</li></ul>
    <h4>QUINTO.</h4><p>Manifiesto mi voluntad de respetar y cumplir los Estatutos, reglamentos, acuerdos y resoluciones emitidos válidamente por la Asamblea General y demás órganos de gobierno del SITAD, ejerciendo mis derechos sindicales con responsabilidad, buena fe y apego a los principios democráticos de la organización.</p>
    <h4>SEXTO.</h4><p>Autorizo mi incorporación al padrón de personas afiliadas del Sindicato de Trabajadores Digitales y solicito que mi registro sea realizado conforme a los procedimientos internos establecidos por el Sindicato y la legislación laboral aplicable.</p>
    <h4>SÉPTIMO.</h4><p>Autorizo al Sindicato de Trabajadores Digitales para recabar, resguardar y tratar mis datos personales exclusivamente para fines relacionados con:</p><ul><li>Mi registro y afiliación sindical.</li><li>La integración y administración de mi expediente sindical.</li><li>La defensa de mis derechos laborales y colectivos.</li><li>La prestación de servicios y beneficios sindicales.</li><li>La comunicación institucional.</li></ul><p>Lo anterior conforme a la legislación aplicable en materia de protección de datos personales.</p>
    <h4>OCTAVO.</h4><p>Reconozco que mi permanencia dentro del Sindicato de Trabajadores Digitales deriva de mi libre voluntad y que podré ejercer los derechos y obligaciones que la legislación laboral y los Estatutos sindicales me reconocen.</p>
    <div class="salto"></div>
    <h4>NOVENO.</h4><p>Bajo protesta de decir verdad, manifiesto que la información proporcionada para efectos de mi afiliación es auténtica, corresponde a mi identidad y refleja mi voluntad de formar parte del Sindicato de Trabajadores Digitales.</p>
    <p>Por lo anteriormente expuesto:</p>
    <p><b>SOLICITO FORMALMENTE MI AFILIACIÓN AL SINDICATO DE TRABAJADORES DIGITALES</b></p>
    <p>Sin otro particular, firmo el presente documento para todos los efectos legales y estatutarios a que haya lugar.</p>
    <table class="sg" style="margin:10px 0 30px">${tabla.map(([k, val]) => `<tr><td style="width:32%"><strong>${k}:</strong></td><td>${v(val)}</td></tr>`).join('')}</table>
    <p style="text-align:center"><b>Atentamente</b></p><br><br>
    <div class="sg-firma">Firma de la persona solicitante</div>
    <p class="mt-3"><b>C.c.p. Archivo</b></p>
    <p>El presente formato deberá requisitarse por duplicado en original, anexando el aviso de privacidad correspondiente y copia de identificación oficial vigente.</p>
    <div class="salto"></div>
    <p style="text-align:center"><b>AVISO DE PRIVACIDAD CON CONSENTIMIENTO EXPRESO</b></p>
    <p>El <b>Sindicato de Trabajadores Digitales (SITAD)</b>, con domicilio en ${CFG.DOMICILIO_SG}, teléfono para contacto ${CFG.TELEFONO_CONTACTO}, correo electrónico ${CFG.CORREO_FINANZAS}, es responsable del tratamiento de los datos personales que sean proporcionados por las personas afiliadas, mismos que serán protegidos conforme a lo establecido en la <b>Ley Federal de Protección de Datos Personales en Posesión de los Particulares</b> y demás disposiciones aplicables.</p>
    <p>Los datos personales recabados serán utilizados exclusivamente para finalidades relacionadas con:</p><ul><li>El proceso de afiliación sindical.</li><li>La integración y actualización del padrón de personas afiliadas.</li><li>La administración de la relación sindical.</li><li>La comunicación institucional.</li><li>La prestación de servicios y beneficios sindicales.</li><li>El cumplimiento de obligaciones legales y estatutarias.</li></ul>
    <p>Mediante la firma del presente documento, la persona titular manifiesta su consentimiento expreso para el tratamiento de sus datos personales conforme a las finalidades señaladas.</p>
    <p>Asimismo, podrá ejercer sus derechos de <b>Acceso, Rectificación, Cancelación u Oposición (derechos ARCO)</b> mediante solicitud presentada ante el domicilio del Sindicato o por los medios que para tal efecto establezca la organización.</p>
    <p class="mt-2"><b>Nombre:</b> ${v(s.nombre_completo)} · <b>Folio:</b> ${v(s.folio)}</p><br><br>
    <div class="sg-firma">Firma de la persona solicitante</div>
  </div>`;
}

// ===================== Anexo 23 · Cédula de afiliación =====================
function anexo23(s) {
  const dep = Array.isArray(s.dependientes) ? s.dependientes : [];
  const d = i => dep[i] || {};
  const mem = (pag) => sgMembrete('CÉDULA DE AFILIACIÓN', ['<b>ORGANIZACIÓN<br>C.E.N.</b>', '<b>ANEXO 23</b>', `Página ${pag} de 2`]);
  return `<div class="documento doc-sg">${mem(1)}
    <table class="sg"><tr><td style="background:#D9D9D9"><strong>TIPO DE MOVIMIENTO</strong> &nbsp;&nbsp; Alta ${s.tipo_movimiento === 'Modificación' ? '☐' : '☒'} &nbsp;&nbsp; Modificacion ${s.tipo_movimiento === 'Modificación' ? '☒' : '☐'}</td></tr></table>
    <div class="sg-seccion">INFORMACIÓN GENERAL DEL TRABAJADOR</div>
    <table class="sg">${fila2(cel('Fecha de Nacimiento', fecha(s.fecha_nacimiento)), cel('Estado Civil', s.estado_civil))}<tr><td colspan="2">${cel('Nombre', s.nombre_completo)}</td></tr>${fila2(cel('R.F.C.', s.rfc), cel('CURP', s.curp))}${fila2(cel('Domicilio', s.domicilio), cel('C.P.', s.cp))}<tr><td colspan="2">${cel('Colonia', s.colonia)}</td></tr>${fila2(cel('Ciudad', s.municipio), cel('Estado', s.estado_domicilio))}${fila2(cel('E-mail', s.correo), cel('Celular', s.telefono))}</table>
    <div class="sg-seccion">SEGURIDAD SOCIAL</div>
    <table class="sg"><tr><td colspan="2">${cel('NSS', s.nss)}</td></tr>${fila2(cel('Unidad Medica', s.unidad_medica), cel('Ciudad', s.unidad_medica_ciudad))}</table>
    <div class="sg-seccion">SITUACIÓN PROFESIONAL</div>
    <table class="sg">${fila2(cel('Escolaridad', s.escolaridad), `Trunca ( ${s.escolaridad_estado === 'Trunca' ? 'X' : '&nbsp;&nbsp;'} ) &nbsp;&nbsp;&nbsp; Concluida ( ${s.escolaridad_estado === 'Concluida' ? 'X' : '&nbsp;&nbsp;'} )`)}<tr><td colspan="2">${cel('Carrera', s.carrera)}</td></tr></table>
    <div class="sg-seccion">INFORMACIÓN DE LA EMPRESA</div>
    <table class="sg"><tr><td colspan="2">${cel('Ocupación', s.puesto)}</td></tr>${fila2(cel('Empresa', s.empresa), cel('Ingreso', fecha(s.fecha_inicio_relacion)))}${fila2(cel('Domicilio Fiscal', s.domicilio_fiscal), cel('Frecuencia', s.frecuencia_pago))}${fila2(cel('Teléfono', s.telefono_empresa), cel('Jefe Laboral', s.jefe_laboral))}</table>
    <div class="sg-seccion">SEGURO DEL INSTRUMENTO DE TRABAJO</div>
    <table class="sg"><tr><td colspan="2">${cel('Seguro', s.seguro_aseguradora)}</td></tr>${fila2(cel('Póliza ó No. de Afiliación', s.seguro_poliza), cel('Vigencia', s.seguro_vigencia))}</table>
    <div class="sg-seccion">INFORMACIÓN DEL CONYUGUE</div>
    <table class="sg"><tr><td colspan="2">${cel('Nombre', s.conyuge_nombre || 'No aplica')}</td></tr>${fila2(cel('Domicilio', s.conyuge_domicilio), cel('Teléfono', s.conyuge_telefono))}</table>
    <div class="sg-seccion">DEPENDIENTES</div>
    <table class="sg">${[0, 1, 2].map(i => `<tr><td colspan="2">${cel('Nombre', d(i).nombre || (i === 0 && !dep.length ? 'No aplica' : ''))}</td></tr>${fila2(cel('Parentesco', d(i).parentesco), cel('Edad', d(i).edad))}`).join('')}</table>
    <div class="salto"></div>${mem(2)}
    <p style="margin-top:30px">__X__ Estoy de acuerdo con el Aviso de Privacidad<br>__X__ Acepto los Estatutos y Documentos Básicos de la Organización.</p>
    <p class="mt-3"><b>Requisitos:</b></p><ol><li>Constancia de Situación Fiscal</li><li>CURP</li><li>Identificación Oficial</li><li>Solicitud de Afiliación</li></ol>
    <p><b><u>En caso de trabajadores del transporte de pasajeros o ultima milla,</u></b> será necesario también enviar lo siguiente:</p><ol type="a"><li>Copia de su Tarjeta de Circulación.</li><li>Copia de Póliza de Seguro.</li><li>Copia de Licencia de Manejo.</li></ol>
    <p class="mt-3"><b>Notas:</b></p><ul><li>Todos los campos de esta solicitud son obligatorios.</li><li>Cualquier modificación a los datos señalados en el formato, deberán ser notificados a la Secretaría de Organización para la actualización de su registro.</li></ul>
    <p class="mt-3 small"><b>Folio:</b> ${v(s.folio)} · <b>Nombre:</b> ${v(s.nombre_completo)}</p><br><br>
    <div class="sg-firma">Firma de la persona solicitante</div>
  </div>`;
}

// ===================== Anexo 15 · Constancia de Registro =====================
function anexo15(x, s, cfg) {
  const enConst = !!x.asamblea_fecha_hora; const fe = partes(hoy()); const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Mexico_City' });
  const registro = x.created_at ? new Date(x.created_at).toLocaleString('es-MX', { timeZone: 'America/Mexico_City', dateStyle: 'short', timeStyle: 'short' }) : fecha(x.fecha_alta);
  const secLabel = x.seccion_numero ? `Sección ${x.seccion_numero}` : x.seccion;
  return `<div class="documento doc-sg">${sgMembrete(enConst ? 'ASAMBLEA CONSTITUTIVA' : 'CONSTANCIA DE REGISTRO', ['ORGANIZACIÓN<br>C.E.N.', 'Anexo 15', 'Página 1 de 1'])}
    <p style="text-align:right">Número de Constancia Registro: <b><u>&nbsp;${v(x.folio)}&nbsp;</u></b></p>
    <p style="font-size:14pt;font-weight:700;margin:24px 0 6px">${v(x.nombre_completo).toUpperCase()}</p>
    <p>Trabajador Digital</p>
    <p style="text-align:justify">La secretaria de organización, emite la presente <b>CONSTANCIA de REGISTRO</b> ${enConst ? `a los Trabajadores Digitales que participarán en la Asamblea Constitutiva de la ${secLabel} de Trabajadores Digitales.` : `a la persona trabajadora digital registrada en el Padrón de Afiliados del Sindicato, con adscripción a la ${v(x.seccion)}, con la autorización del Secretario General de fecha ${fecha(x.fecha_autorizacion_sg)}.`}</p>
    <p>Los datos del trabajador registrado se describen a continuación:</p>
    <table class="sg"><tr><td style="width:32%"><strong>Nombre del Trabajador:</strong></td><td>${v(x.nombre_completo)}</td></tr><tr><td><strong>Cargo:</strong></td><td>${v(x.puesto)}</td></tr><tr><td><strong>Patron:</strong></td><td>${v(x.patron || 'REEDCAM')}</td></tr><tr><td><strong>Fecha y Hora de Registro:</strong></td><td>${registro}</td></tr></table>
    ${enConst ? `<p style="text-align:center;font-size:13pt;font-weight:700;margin:22px 0 10px">INFORMACIÓN PARA LA ASAMBLEA</p>
    <div class="sg-caja"><ul style="margin:0;padding-left:18px;line-height:1.7">
      <li>Para su ingreso deberá portar su gafete expedido por el Comité de Organización, Identificación Oficial, y exhibir su perfil de trabajador digital.</li>
      <li>Fecha, Hora y lugar de la Asamblea Constituyente: <b>${esc(fechaHoraLarga(x.asamblea_fecha_hora)).toUpperCase()}</b></li>
      <li>Dirección: <b>${v(x.asamblea_direccion)}</b></li>
      <li><b>Esperemos contar con su valiosa presencia.</b></li>
      <li>Se solicita llegar con una horas de anticipación para su acreditación y registro de asistencia.</li>
      <li>Conozca el contenido de los documentos básicos en la siguiente liga digital:<br><a href="${esc(cfg.liga_documentos_basicos || CFG.LIGA_DOCUMENTOS_BASICOS)}">${esc(cfg.liga_documentos_basicos || CFG.LIGA_DOCUMENTOS_BASICOS)}</a></li>
      <li>Para más información, consulte las bases de la convocatoria en la siguiente liga digital:<br>${x.convocatoria_url ? `<a href="${esc(x.convocatoria_url)}">${esc(x.convocatoria_url)}</a>` : '<i>(la Sección la comparte con la convocatoria)</i>'}</li></ul></div>` :
    `<div class="sg-caja"><ul style="margin:0;padding-left:18px;line-height:1.7"><li>Su credencial, con su número de afiliación, se le entrega personalmente en la oficina de su Sección al presentar su documentación en original; es el documento con el que acredita su calidad de persona afiliada ante el Sindicato y en sus asambleas.</li><li>Conozca el contenido de los documentos básicos en la siguiente liga digital:<br><a href="${esc(cfg.liga_documentos_basicos || CFG.LIGA_DOCUMENTOS_BASICOS)}">${esc(cfg.liga_documentos_basicos || CFG.LIGA_DOCUMENTOS_BASICOS)}</a></li><li>La cuota sindical ordinaria se cubre conforme a las indicaciones de la Secretaría de Finanzas.</li></ul></div>`}
    <p style="text-align:right;margin-top:36px"><b>Expedido por la Secretaria de Organización<br>En la Ciudad de México, ${fe.d} DE ${fe.mes.toUpperCase()} DEL ${fe.a} | ${hora} hrs</b></p>
  </div>`;
}

// ===================== Anexo 14 · Gafete =====================
async function anexo14(x, cfg) {
  const liga = cfg.liga_documentos_basicos || CFG.LIGA_DOCUMENTOS_BASICOS;
  const evento = x.asamblea_fecha_hora ? `ASAMBLEA CONSTITUTIVA<br>${x.seccion_numero ? 'SECCIÓN ' + x.seccion_numero + ' · ' : ''}${esc(x.seccion.replace('Sección ', '')).toUpperCase()}` : `PERSONA AFILIADA<br>${esc(x.seccion).toUpperCase()}`;

  return `<div class="documento apaisado">${membreteFT('Lista de asistencia · Asamblea Seccional')}
    <p><b>${secLabel(a)}</b> · Asamblea ${v(a.tipo)} · <b>Fecha:</b> ${fechaLarga(a.fecha)} · <b>Lugar:</b> ${v(a.lugar)}</p>
    <p><b>Corte del registro de afiliados adscritos con derecho a voto:</b> ${fechaLarga(a.corte_fecha)} · <b>Total al corte:</b> ${a.total_con_derecho ?? pad.length} · <b>Quórum requerido (mitad más uno):</b> ${a.quorum_requerido ?? (Math.floor(pad.length / 2) + 1)}</p>
    <table><tr><th style="width:4%">№</th><th>Nombre completo (como aparece en el corte)</th><th style="width:9%">No. afil.</th><th style="width:11%">Identificación</th><th style="width:8%">Gafete</th><th style="width:8%">Modalidad</th><th style="width:7%">Hora</th><th style="width:18%">Firma</th></tr>
      ${pad.map((x, i) => { const s = reg.get(x.afiliado_id); return `<tr><td>${i + 1}</td><td>${v(x.nombre_completo)}</td><td>${x.numero_afiliacion ?? ''}</td><td>${s ? v(s.identificacion) : '☐ INE ☐ Otra'}</td><td>${s ? (s.gafete ? 'Sí' : 'No') : '☐ Sí ☐ No'}</td><td>${s ? (s.modalidad === 'R' ? 'Remota' : 'Presencial') : '☐ P ☐ R'}</td><td>${s ? hora(s.checkin_at) : '__:__'}</td><td>${s ? '' : ''}</td></tr>`; }).join('')}</table>
    <p class="small">Modalidad: P = presencial · R = remota. Quien aparece en el corte y se identifica se registra y vota aunque no traiga el gafete impreso; se anota en observaciones.</p>
    <h2>Observadores (sin voz ni voto)</h2>
    <table><tr><th style="width:4%">№</th><th>Nombre completo</th><th>Motivo (no está en el corte, invitado, autoridad sindical)</th><th style="width:8%">Hora</th><th style="width:18%">Firma</th></tr>${(obs.length ? obs : [{}, {}, {}]).map((s, i) => `<tr><td>${i + 1}</td><td>${v(s.nombre)}</td><td>${v(s.motivo_observador)}</td><td>${s.checkin_at ? hora(s.checkin_at) : '__:__'}</td><td></td></tr>`).join('')}</table>
    <p><b>Observaciones (personas en el corte sin gafete, incidencias):</b> ${asis.filter(s => s.incidencia).map(s => v(s.nombre) + ': ' + v(s.incidencia)).join(' · ') || '____________________________________________'}</p>
    <p><b>Asistentes con derecho a voto:</b> ${asis.filter(s => s.con_derecho).length} · <b>Registró (nombre y firma):</b> ______________________________ · Secretaría de Organización de la Sección</p>
    ${pieFT('Formato AS-05 (prellenado por la plataforma)')}</div>`;
}
function computoAS06(a, q, verifs) {
  const hora = ts => ts ? new Date(ts).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Mexico_City' }) : '____:____';
  const hay = q && q.hay_quorum;
  return `<div class="documento">${membreteFT('Cómputo de quórum e informe al Secretario General Seccional')}
    <p><b>${secLabel(a)}</b> · Asamblea ${v(a.tipo)} · <b>Fecha:</b> ${fechaLarga(a.fecha)} · <b>Hora convocada:</b> ${horaCorta(a.hora)}</p>
    <h2>1. Cómputo al cierre del registro</h2>
    <table><tr><th>Concepto</th><th style="width:14%">Número</th></tr>
      <tr><td>A. Afiliados adscritos a la Sección con derecho a voto al corte de tres días antes (${fechaLarga(a.corte_fecha)})</td><td>${q ? q.total_con_derecho ?? '' : ''}</td></tr>
      <tr><td>B. Quórum requerido: la mitad más uno de A</td><td>${q ? q.quorum_requerido ?? '' : ''}</td></tr>
      <tr><td>C. Asistentes con derecho a voto registrados</td><td>${q ? q.presentes : ''}</td></tr>
      <tr><td>D. De C, presentes en modalidad remota (sólo si la convocatoria lo permite)</td><td>${q ? q.remotos : ''}</td></tr>
      <tr><td>E. Observadores registrados (no cuentan para el quórum)</td><td>${q ? q.observadores : ''}</td></tr></table>
    <p><b>Resultado:</b> ${hay ? '☒' : '☐'} <b>Hay quórum</b> (C es igual o mayor que B) &nbsp; ${q && !hay ? '☒' : '☐'} <b>No hay quórum</b> (C es menor que B) · <b>Hora del cómputo:</b> ${a.instalada_at ? hora(a.instalada_at) : hora(null)}</p>
    <h2>2. Informe al Secretario General Seccional</h2>
    <p>La Secretaría de Organización de la Sección informa al Secretario General del Comité Ejecutivo Seccional que, verificada la asistencia con base en el registro de afiliados adscritos a la Sección al corte indicado, se encuentran presentes <b>${q ? q.presentes : '______'}</b> personas afiliadas con derecho a voto de un total de <b>${q ? q.total_con_derecho ?? '______' : '______'}</b>, por lo que ${hay ? '☒' : '☐'} <b>existe</b> ${q && !hay ? '☒' : '☐'} <b>no existe</b> el quórum requerido para instalar la asamblea.</p>
    <div class="firmas"><div>Nombre y firma · Secretaría de Organización de la Sección</div><div>Recibí · Secretario General del Comité Ejecutivo Seccional · Hora ____:____</div></div>
    <p class="small"><b>Si no hay quórum.</b> El Secretario General Seccional no declara instalada la asamblea y no se adopta ningún acuerdo. Organización deja constancia en este formato, conserva la lista de asistencia y el Comité Ejecutivo Seccional acuerda una nueva convocatoria conforme al Estatuto. Se informa a la Secretaría de Organización del CEN el mismo día.</p>
    <h2>3. Conservación del quórum durante las votaciones</h2>
    <table><tr><th>Punto del orden del día</th><th style="width:10%">Hora</th><th style="width:16%">Presentes con derecho a voto</th><th style="width:18%">¿Se conserva el quórum?</th><th style="width:18%">Escrutador que confirma</th></tr>${(verifs.length ? verifs : [{}, {}, {}]).map(x => `<tr><td>${v(x.punto)}</td><td>${x.verificado_at ? hora(x.verificado_at) : '____:____'}</td><td>${x.presentes ?? ''}</td><td>${x.verificado_at ? (x.conserva ? '☒ Sí ☐ No' : '☐ Sí ☒ No') : '☐ Sí ☐ No'}</td><td></td></tr>`).join('')}</table>
    <p class="small"><i>Este formato se anexa a la lista de asistencia y se sube con ella a la carpeta 04-Asambleas. En la Asamblea Constitutiva lo llena y firma la Secretaría de Organización del CEN.</i></p>
    ${pieFT('Formato AS-06 (prellenado por la plataforma)')}</div>`;
}
async function datosAsamblea() {
  const [r1, r2, r3, r4, r5] = await Promise.all([
    sb.from('v_asambleas').select('*').eq('id', id).single(),
    sb.from('asamblea_padron').select('*').eq('asamblea_id', id).order('nombre_completo'),
    sb.from('asistencias').select('*').eq('asamblea_id', id).order('checkin_at'),
    sb.from('asamblea_verificaciones').select('*').eq('asamblea_id', id).order('verificado_at'),
    sb.rpc('computo_quorum', { p_asamblea: id }),
  ]);
  let pad = r2.data || [];
  if (r1.data && !r1.data.corte_congelado_at) { const { data } = await sb.from('v_padron').select('id, numero_afiliacion, folio, nombre_completo').eq('seccion_id', r1.data.seccion_id).eq('estatus', 'Activo').lte('fecha_alta', r1.data.corte_fecha).order('nombre_completo'); pad = (data || []).map(x => ({ afiliado_id: x.id, ...x })); }
  return { a: r1.data, pad, asis: r3.data || [], verifs: r4.data || [], q: r5.data && r5.data[0] ? r5.data[0] : null };
}

// ===================== Despacho =====================
try {
  if (tipo === 'solicitud' || tipo === 'cedula' || tipo === 'dictamen' || tipo === 'prevencion') {
    const s = await datosSolicitud();
    if (!s) doc.innerHTML = '<div class="aviso error" style="max-width:700px;margin:2rem auto">No se encontró la solicitud. Revisa el folio y el correo.</div>';
    else if (tipo === 'solicitud') doc.innerHTML = anexo12(s);
    else if (tipo === 'cedula') doc.innerHTML = anexo23(s);
    else { const { data: docs } = await sb.from('solicitud_documentos').select('tipo').eq('solicitud_id', s.id); doc.innerHTML = tipo === 'dictamen' ? ft001(s, docs) : ft002(s); }
  } else if (['constancia', 'gafete', 'finanzas', 'credencial'].includes(tipo)) {
    const [{ data: x }, cfg] = await Promise.all([sb.from('v_padron').select('*').eq('id', id).single(), config()]);
    if (!x) doc.innerHTML = '<div class="aviso error">No se encontró el registro del padrón.</div>';
    else if (tipo === 'constancia') doc.innerHTML = anexo15(x, null, cfg);
    else if (tipo === 'gafete') await anexo14(x, cfg);
    else if (tipo === 'finanzas') doc.innerHTML = cartaFinanzas(x, cfg);
    else { const u = credencial(x); const { toCanvas } = await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm'); toCanvas($('#qr'), u, { width: 78, margin: 0, color: { dark: '#171717' } }); }
  } else if (['convocatoria', 'lista_corte', 'asistencia', 'quorum'].includes(tipo)) {
    const d = await datosAsamblea();
    if (!d.a) doc.innerHTML = '<div class="aviso error">No se encontró la asamblea.</div>';
    else if (tipo === 'convocatoria') doc.innerHTML = convocatoriaAS01(d.a);
    else if (tipo === 'lista_corte') doc.innerHTML = listaCorte(d.a, d.pad);
    else if (tipo === 'asistencia') doc.innerHTML = listaAsistenciaAS05(d.a, d.pad, d.asis);
    else doc.innerHTML = computoAS06(d.a, d.q, d.verifs);
  } else if (tipo === 'comprobante') {
    const [{ data: pg }, cfg] = await Promise.all([sb.from('v_pagos').select('*').eq('id', id).single(), config()]);
    doc.innerHTML = pg ? comprobantePago(pg, cfg) : '<div class="aviso error">No se encontró el pago.</div>';
  } else doc.innerHTML = '<div class="aviso error">Tipo de documento no válido.</div>';
} catch (e) { doc.innerHTML = `<div class="aviso error" style="max-width:700px;margin:2rem auto">No se pudo preparar el documento: ${esc(e.message || e)}</div>`; }
