<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud · CEN · SITAD</title>
<link rel="icon" href="../assets/sitad-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header id="cabecera"></header>
<main class="contenido">
  <p class="small"><a href="./">← Bandeja de solicitudes</a></p>
  <div id="vista"><p class="cargando">Cargando…</p></div>
</main>
<footer id="pie"></footer>
<script type="module">
import { sb, $, $$, esc, toast, ocupado, param, armazon, requerirRol, fecha, fechaLarga, hoy, DOCS, DOC_NOMBRE, ESTADO_INFO, SEMAFORO_TXT, urlFirmada, subirArchivo, validarArchivo, rutaDocumento, mailto, correoAcuse, correoPrevencion, correoFavorable, correoDesfavorable, correoAlta, correoAlSG, ROOT, CFG } from '../assets/app.js';
const p = await requerirRol(['cen_organizacion', 'cen_lectura', 'sg']); if (!p) throw new Error('sin acceso');
await armazon({ titulo: 'Organización del CEN', nav: [{ href: ROOT + 'cen/', texto: 'Bandeja', id: 'cen' }, { href: ROOT + 'sg/', texto: 'Autorizaciones', id: 'sg' }], activa: 'cen' });
const esOrg = p.rol === 'cen_organizacion'; const id = param('id'); const vista = $('#vista');
let s, docs, pad, correoSG = '';
await cargar();

async function cargar() {
  const [r1, r2, r3, r4] = await Promise.all([
    sb.from('v_solicitudes').select('*').eq('id', id).single(),
    sb.from('solicitud_documentos').select('*').eq('solicitud_id', id).order('created_at'),
    sb.from('v_padron').select('*').eq('solicitud_id', id).maybeSingle(),
    sb.from('usuarios_roles').select('email').eq('rol', 'sg').eq('activo', true).not('email', 'like', '%@sitad.test').limit(1),
  ]);
  if (r1.error || !r1.data) { vista.innerHTML = `<div class="aviso error">No se encontró la solicitud.</div>`; return; }
  s = r1.data; docs = r2.data || []; pad = r3.data; correoSG = r4.data && r4.data[0] ? r4.data[0].email : ''; s.documentos = docs;
  render();
}

function render() {
  const cerrada = ['Ejecutada en padrón', 'Dictaminada desfavorable', 'Desistida'].includes(s.estado);
  const alertas = [];
  if (s.es_confianza) alertas.push('La persona declaró desempeñar funciones de confianza. Verifica antes de dictaminar: los trabajadores de confianza legalmente excluidos no pueden afiliarse.');
  if (s.duplicado) alertas.push('Posible duplicado: hay otra solicitud viva o un afiliado activo con la misma CURP o el mismo correo. Si es la misma persona, no se abre nuevo trámite: responde indicando el folio existente.');
  if (!s.documentos_completos && !cerrada) alertas.push(`Expediente incompleto: faltan ${DOCS.filter(d => !docs.find(x => x.tipo === d.tipo)).map(d => d.corto).join(', ')}.`);
  if (s.fuera_de_plazo) alertas.push('Esta solicitud está fuera del plazo estatutario. Atiéndela hoy.');
  const cc = s.seccion_correo || '';
  vista.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem">
    <div><p class="small muted mb-0">${esc(s.seccion)} · ${s.canal === 'publico' ? 'capturada por la persona desde la liga pública' : 'registrada por la Sección'}</p>
      <h1>${esc(s.folio)} <span class="etiqueta ${(ESTADO_INFO[s.estado] || {}).etiqueta || ''}">${esc(s.estado)}</span></h1>
      <p class="mb-0"><span class="punto ${s.semaforo}"></span>${esc(SEMAFORO_TXT[s.semaforo] || '')}</p></div>
    <div class="small muted" style="text-align:right">Recibida el ${fechaLarga(s.fecha_recepcion)}<br>Límite para dictaminar: <b>${fecha(s.limite_dictamen)}</b>${s.limite_ejecucion ? `<br>Límite para ejecutar el alta: <b>${fecha(s.limite_ejecucion)}</b>` : ''}</div>
  </div>
  ${alertas.map(a => `<div class="aviso ${/fuera del plazo|duplicado|confianza/.test(a) ? 'error' : 'atencion'} small">${esc(a)}</div>`).join('')}

  <div class="ficha mt-2">
    <div>
      <div class="tarjeta">
        <h3>Persona solicitante</h3>
        <dl class="datos">
          <dt>Nombre</dt><dd><b>${esc(s.nombre_completo)}</b></dd>
          <dt>CURP</dt><dd>${esc(s.curp || '—')}</dd>
          <dt>Nacimiento · género</dt><dd>${fecha(s.fecha_nacimiento)} · ${esc(s.genero || '—')}</dd>
          <dt>Domicilio</dt><dd>${esc(s.domicilio || '—')}</dd>
          <dt>Teléfono · correo</dt><dd>${esc(s.telefono || '—')} · <a href="${mailto(s.correo, correoAcuse(s).asunto, correoAcuse(s).cuerpo, cc)}">${esc(s.correo)}</a></dd>
          <dt>Empresa · puesto</dt><dd>${esc(s.empresa)} · ${esc(s.puesto || '—')}</dd>
          <dt>Centro de trabajo</dt><dd>${esc(s.centro_trabajo || '—')}${s.fecha_inicio_relacion ? ` · desde ${fecha(s.fecha_inicio_relacion)}` : ''}</dd>
          <dt>Declaraciones</dt><dd>${s.acepta_estatuto ? 'Acepta el Estatuto (' + fecha(s.acepta_estatuto_at) + ')' : '<span class="rojo">NO manifestó aceptación del Estatuto</span>'} · ${s.es_confianza ? '<span class="rojo">declara funciones de confianza</span>' : 'no es de confianza'} · aviso de privacidad ${s.aviso_privacidad_at ? fecha(s.aviso_privacidad_at) : '—'}</dd>
        </dl>
      </div>

      <div class="tarjeta">
        <h3>Expediente (${docs.filter(d => d.tipo !== 'otro').length} de 5)</h3>
        <ul class="doc-lista" id="docs">${DOCS.map(d => { const x = docs.find(q => q.tipo === d.tipo); return `<li>
          <span class="punto ${x ? (x.validado === false ? 'amarillo' : x.validado ? 'verde' : 'azul') : 'rojo'}"></span>
          <span class="nombre">${esc(d.nombre)}${x ? `<br><span class="tiny muted">${esc(x.nombre_archivo || '')} · ${fecha(x.created_at)}${x.observacion ? ' · <span style="color:var(--ambar)">' + esc(x.observacion) + '</span>' : ''}</span>` : '<br><span class="tiny rojo">Falta</span>'}</span>
          ${x ? `<a href="#" class="btn secundario chico" data-ver="${x.id}">Ver</a>` : ''}
          ${x && esOrg && !cerrada ? `<button class="btn discreto chico" data-ok="${x.id}" title="Marcar como revisado y correcto">${x.validado ? '✓ Correcto' : 'Dar por bueno'}</button><button class="btn discreto chico" data-obs="${x.id}" title="Anotar un defecto">Observación</button>` : ''}
          ${esOrg && !cerrada ? `<label class="btn discreto chico" style="cursor:pointer">${x ? 'Reemplazar' : 'Subir'}<input type="file" class="oculto" data-subir="${d.tipo}" accept="application/pdf,image/jpeg,image/png"></label>` : ''}
        </li>`; }).join('')}</ul>
        ${s.expediente_url ? `<p class="small mt-2">Expediente definitivo en Drive: <a href="${esc(s.expediente_url)}" target="_blank">${esc(s.expediente_url)}</a></p>` : ''}
      </div>

      <div class="tarjeta">
        <h3>Notas internas</h3>
        <textarea id="notas" ${esOrg ? '' : 'disabled'}>${esc(s.notas || '')}</textarea>
        ${esOrg ? '<div class="acciones"><button class="btn secundario chico" id="guardar-notas">Guardar notas</button></div>' : ''}
      </div>
    </div>

    <div class="lateral">
      <div class="tarjeta">
        <h3>Trámite</h3>
        <ol class="linea-tiempo">
          <li class="hecho"><b>Recibida</b><span>${fechaLarga(s.fecha_recepcion)} · límite para prevenir ${fecha(s.limite_prevencion)}</span></li>
          ${s.fecha_prevencion ? `<li class="hecho"><b>Prevenida</b><span>${fechaLarga(s.fecha_prevencion)} · plazo para subsanar ${fecha(s.limite_subsanacion)}</span></li>` : ''}
          ${s.fecha_subsanacion ? `<li class="hecho"><b>Subsanada</b><span>${fechaLarga(s.fecha_subsanacion)} · nuevo límite de dictamen ${fecha(s.limite_dictamen)}</span></li>` : ''}
          <li class="${s.fecha_dictamen ? 'hecho' : ''}"><b>Dictamen ${s.sentido ? '· ' + esc(s.sentido) : ''}</b><span>${s.fecha_dictamen ? fechaLarga(s.fecha_dictamen) : 'Pendiente · límite ' + fecha(s.limite_dictamen)}</span></li>
          ${s.sentido === 'Favorable' || s.fecha_envio_sg ? `<li class="${s.fecha_envio_sg ? 'hecho' : ''}"><b>Enviada al Secretario General</b><span>${s.fecha_envio_sg ? fechaLarga(s.fecha_envio_sg) : 'Pendiente'}</span></li>` : ''}
          ${s.sentido === 'Favorable' ? `<li class="${s.fecha_autorizacion_sg ? 'hecho' : ''}"><b>Autorización del SG</b><span>${s.fecha_autorizacion_sg ? fechaLarga(s.fecha_autorizacion_sg) + (s.autorizacion_sg_ref ? ' · ' + esc(s.autorizacion_sg_ref) : '') : 'Pendiente'}</span></li>` : ''}
          ${s.sentido === 'Favorable' ? `<li class="${s.fecha_ejecucion_padron ? 'hecho' : ''}"><b>Alta en el Padrón</b><span>${s.fecha_ejecucion_padron ? fechaLarga(s.fecha_ejecucion_padron) + (pad ? ' · No. ' + pad.numero_afiliacion : '') : (s.limite_ejecucion ? 'Pendiente · límite ' + fecha(s.limite_ejecucion) : 'Pendiente')}</span></li>` : ''}
        </ol>
      </div>
      <div class="tarjeta" id="acciones-caja">
        <h3>Acciones</h3>
        ${accionesHtml(cerrada)}
      </div>
      <div class="tarjeta">
        <h3>Documentos y correos</h3>
        <ul class="small" style="padding-left:1.1rem;margin:0">
          <li><a href="${mailto(s.correo, correoAcuse(s).asunto, correoAcuse(s).cuerpo, cc)}">Correo 1 · Acuse de recepción</a></li>
          ${s.fecha_prevencion ? `<li><a href="${ROOT}documento.html?tipo=prevencion&id=${s.id}" target="_blank">FT-002 · Prevención (imprimir)</a> · <a href="${mailto(s.correo, correoPrevencion(s, faltantesGuardados()).asunto, correoPrevencion(s, faltantesGuardados()).cuerpo, cc)}">Correo 2</a></li>` : ''}
          ${s.fecha_dictamen ? `<li><a href="${ROOT}documento.html?tipo=dictamen&id=${s.id}" target="_blank">FT-001 · Dictamen (imprimir)</a> · <a href="${s.sentido === 'Favorable' ? mailto(s.correo, correoFavorable(s).asunto, correoFavorable(s).cuerpo, cc) : mailto(s.correo, correoDesfavorable(s).asunto, correoDesfavorable(s).cuerpo, cc)}">Correo ${s.sentido === 'Favorable' ? '3' : '4'}</a></li>` : ''}
          ${s.sentido === 'Favorable' && !s.fecha_autorizacion_sg ? `<li><a href="${mailto(correoSG, correoAlSG([s]).asunto, correoAlSG([s]).cuerpo)}">Remitir al Secretario General</a></li>` : ''}
          ${pad ? `<li><a href="${ROOT}documento.html?tipo=constancia&id=${pad.id}" target="_blank">AF-05 · Constancia de Registro</a> · <a href="${ROOT}documento.html?tipo=credencial&id=${pad.id}" target="_blank">Credencial</a> · <a href="${mailto(s.correo, correoAlta(pad, s).asunto, correoAlta(pad, s).cuerpo, cc)}">Correo 5 · Bienvenida</a> · <a href="${mailto('', 'SITAD · Alta en el Padrón · ' + pad.folio, correoAlta(pad, s).finanzas)}">Aviso a Finanzas</a></li>` : ''}
        </ul>
        <p class="tiny muted mt-2">Los correos se abren prellenados en tu programa de correo hasta que exista el buzón institucional en sindicatodigital.org.</p>
      </div>
    </div>
  </div>`;
  enlazar(cerrada);
}

function faltantesGuardados() { const m = /\[PREVENCION\]([\s\S]*?)\[\/PREVENCION\]/.exec(s.notas || ''); return m ? m[1].trim().split('\n').filter(Boolean) : ['Ver oficio de prevención.']; }

function accionesHtml(cerrada) {
  if (!esOrg) return '<p class="small muted">Solo lectura.</p>';
  if (cerrada) return `<p class="small muted">Trámite concluido.</p>`;
  const b = [];
  if (['Recibida', 'Subsanada'].includes(s.estado)) {
    if (!s.fecha_prevencion) b.push(`<button class="btn secundario" id="a-prevenir">Prevenir (una sola vez)</button>`);
    b.push(`<button class="btn" id="a-favorable">Dictaminar FAVORABLE</button>`, `<button class="btn secundario" id="a-desfavorable">Dictaminar desfavorable</button>`);
  }
  if (s.estado === 'Prevenida') b.push(`<button class="btn" id="a-subsanada">Registrar subsanación recibida</button>`, `<button class="btn secundario" id="a-desfavorable">Dictaminar desfavorable (no subsanó)</button>`);
  if (s.estado === 'Dictaminada favorable') b.push(`<button class="btn" id="a-enviar-sg">Marcar como enviada al SG</button>`);
  if (s.estado === 'Enviada al SG') b.push(`<p class="small muted">En espera de la autorización del Secretario General (desde ${fecha(s.fecha_envio_sg)}). Él la registra en su bandeja; si te la comunica por otro medio, anótala aquí:</p><button class="btn secundario" id="a-autorizacion-externa">Registrar autorización recibida por otro medio</button>`);
  if (s.estado === 'Autorizada') b.push(`<button class="btn verde" id="a-alta">Ejecutar alta en el Padrón</button>`);
  b.push(`<button class="btn discreto chico" id="a-desistir">Registrar desistimiento</button>`);
  return `<div class="acciones" style="flex-direction:column;align-items:stretch">${b.join('')}</div>`;
}

function enlazar(cerrada) {
  $$('[data-ver]').forEach(a => a.onclick = async e => { e.preventDefault(); const d = docs.find(x => x.id === a.dataset.ver); try { const u = await urlFirmada(d.archivo_url); window.open(u, '_blank'); } catch (err) { toast('No se pudo abrir: ' + err.message, 'error'); } });
  $$('[data-ok]').forEach(b => b.onclick = async () => { const d = docs.find(x => x.id === b.dataset.ok); const { error } = await sb.from('solicitud_documentos').update({ validado: !d.validado, observacion: d.validado ? d.observacion : null }).eq('id', d.id); if (error) toast(error.message, 'error'); else cargar(); });
  $$('[data-obs]').forEach(b => b.onclick = async () => { const d = docs.find(x => x.id === b.dataset.obs); const o = prompt('Observación sobre este documento (se muestra a la persona en "Consultar mi trámite"):', d.observacion || ''); if (o === null) return; const { error } = await sb.from('solicitud_documentos').update({ observacion: o || null, validado: o ? false : d.validado }).eq('id', d.id); if (error) toast(error.message, 'error'); else cargar(); });
  $$('[data-subir]').forEach(inp => inp.onchange = async () => { const f = inp.files[0]; const err = validarArchivo(f); if (err) return toast(err, 'error'); try {
      const ruta = rutaDocumento(s.seccion_slug, s.folio, inp.dataset.subir, f.name).replace(/(\.[a-z0-9]+)$/i, `-${Date.now()}$1`); await subirArchivo(ruta, f);
      const prev = docs.find(x => x.tipo === inp.dataset.subir); if (prev) await sb.from('solicitud_documentos').delete().eq('id', prev.id);
      const { error } = await sb.from('solicitud_documentos').insert({ solicitud_id: s.id, tipo: inp.dataset.subir, archivo_url: ruta, nombre_archivo: f.name }); if (error) throw error;
      if (s.estado === 'Prevenida' && !s.fecha_subsanacion) await sb.from('solicitudes_afiliacion').update({ fecha_subsanacion: hoy() }).eq('id', s.id);
      toast('Documento guardado.', 'ok'); cargar(); } catch (e) { toast('No se pudo subir: ' + (e.message || e), 'error'); } });
  const gn = $('#guardar-notas'); if (gn) gn.onclick = () => actualizar({ notas: $('#notas').value }, 'Notas guardadas.');
  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = fn; };
  on('a-prevenir', prevenir); on('a-favorable', favorable); on('a-desfavorable', desfavorable); on('a-subsanada', () => actualizar({ fecha_subsanacion: hoy() }, 'Subsanación registrada; el plazo se reanuda.'));
  on('a-enviar-sg', () => actualizar({ fecha_envio_sg: hoy() }, 'Marcada como enviada al SG.', true));
  on('a-autorizacion-externa', () => { const ref = prompt('¿Cómo autorizó el Secretario General? (oficio, correo o mensaje y fecha). Queda como referencia de la autorización.'); if (!ref) return; const f = prompt('Fecha de la autorización (aaaa-mm-dd):', hoy()); if (!f) return; sb.rpc('registrar_autorizacion_externa', { p_id: s.id, p_fecha: f, p_ref: ref }).then(({ error }) => { if (error) toast('No se pudo registrar: ' + error.message, 'error'); else { toast('Autorización registrada.', 'ok'); cargar(); } }); });
  on('a-alta', alta); on('a-desistir', () => { if (!confirm('¿Registrar desistimiento? La solicitud queda sin efectos.')) return; actualizar({ fecha_dictamen: hoy(), sentido: 'Desistimiento' }, 'Desistimiento registrado.'); });
}

async function actualizar(cambios, msg, abrirSG) {
  const { error } = await sb.from('solicitudes_afiliacion').update(cambios).eq('id', s.id);
  if (error) return toast('No se pudo guardar: ' + error.message, 'error');
  toast(msg, 'ok'); await cargar();
  if (abrirSG) window.open(mailto(correoSG, correoAlSG([s]).asunto, correoAlSG([s]).cuerpo), '_blank');
}
async function prevenir() {
  const faltan = DOCS.filter(d => !docs.find(x => x.tipo === d.tipo)).map(d => d.nombre);
  const conObs = docs.filter(d => d.observacion).map(d => `${DOC_NOMBRE[d.tipo]}: ${d.observacion}`);
  const sugerido = [...faltan.map(f => `Falta: ${f}; remítalo por el medio institucional indicando su folio.`), ...conObs];
  const texto = prompt('Puntos de la prevención, uno por renglón (se numeran PRIMERO, SEGUNDO…). Puedes editar:', sugerido.join('\n'));
  if (!texto || !texto.trim()) return;
  const puntos = texto.split('\n').map(x => x.trim()).filter(Boolean);
  const notas = (s.notas || '').replace(/\[PREVENCION\][\s\S]*?\[\/PREVENCION\]\n?/, '') + `\n[PREVENCION]\n${puntos.join('\n')}\n[/PREVENCION]`;
  const { error } = await sb.from('solicitudes_afiliacion').update({ fecha_prevencion: hoy(), notas: notas.trim() }).eq('id', s.id);
  if (error) return toast('No se pudo registrar: ' + error.message, 'error');
  await cargar(); toast('Prevención registrada. Envía el correo 2 y, si aplica, imprime el FT-002.', 'ok');
  window.open(mailto(s.correo, correoPrevencion(s, puntos).asunto, correoPrevencion(s, puntos).cuerpo), '_blank');
}
async function favorable() {
  const req = [];
  if (!s.documentos_completos) req.push('el expediente no está completo');
  if (s.es_confianza) req.push('la persona declaró funciones de confianza');
  if (s.duplicado) req.push('hay un posible duplicado');
  if (!s.acepta_estatuto) req.push('no manifestó aceptación del Estatuto');
  if (req.length && !confirm(`Atención: ${req.join('; ')}. ¿Dictaminar FAVORABLE de todos modos?`)) return;
  if (!confirm(`Dictaminar FAVORABLE la solicitud ${s.folio} de ${s.nombre_completo} y remitirla al Secretario General. ¿Confirmas?`)) return;
  const { error } = await sb.from('solicitudes_afiliacion').update({ fecha_dictamen: hoy(), sentido: 'Favorable', fecha_envio_sg: hoy() }).eq('id', s.id);
  if (error) return toast('No se pudo dictaminar: ' + error.message, 'error');
  await cargar(); toast('Dictamen favorable registrado y enviado al SG. Se abre el correo al SG; después manda el correo 3 a la persona.', 'ok');
  window.open(mailto(correoSG, correoAlSG([s]).asunto, correoAlSG([s]).cuerpo), '_blank');
}
async function desfavorable() {
  const motivo = prompt('Requisito no acreditado y motivo (tal como irá en el dictamen y en el correo 4):'); if (!motivo) return;
  if (!confirm(`Dictaminar DESFAVORABLE ${s.folio}. ¿Confirmas?`)) return;
  const { error } = await sb.from('solicitudes_afiliacion').update({ fecha_dictamen: hoy(), sentido: 'Desfavorable', motivo_desfavorable: motivo }).eq('id', s.id);
  if (error) return toast('No se pudo dictaminar: ' + error.message, 'error');
  await cargar(); toast('Dictamen desfavorable registrado. Envía el correo 4.', 'ok');
  window.open(mailto(s.correo, correoDesfavorable(s).asunto, correoDesfavorable(s).cuerpo), '_blank');
}
async function alta() {
  if (!confirm(`Ejecutar el alta de ${s.nombre_completo} en el Padrón de Afiliados, con adscripción a la ${s.seccion}. Se asigna número de afiliación y se genera la credencial. ¿Confirmas?`)) return;
  const { data, error } = await sb.from('padron').insert({ folio: s.folio, solicitud_id: s.id, seccion_id: s.seccion_id, nombre_completo: s.nombre_completo, curp: s.curp, fecha_nacimiento: s.fecha_nacimiento, genero: s.genero, correo: s.correo, telefono: s.telefono, puesto: s.puesto, centro_trabajo: s.centro_trabajo, fecha_dictamen: s.fecha_dictamen, fecha_autorizacion_sg: s.fecha_autorizacion_sg, autorizacion_sg_ref: s.autorizacion_sg_ref, fecha_alta: hoy(), expediente_url: s.expediente_url }).select('id, numero_afiliacion').single();
  if (error) return toast('No se pudo dar el alta: ' + error.message, 'error');
  await cargar(); toast(`Alta ejecutada. Número de afiliación ${data.numero_afiliacion}. Imprime la constancia y la credencial y envía el correo 5.`, 'ok');
  window.open(`${ROOT}documento.html?tipo=constancia&id=${data.id}`, '_blank');
}
</script>
</body>
</html>
