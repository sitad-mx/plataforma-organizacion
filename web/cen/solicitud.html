<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud · SITAD</title>
<link rel="icon" href="../assets/sitad-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header id="cabecera"></header>
<main class="contenido">
  <p class="small"><a href="#" id="volver">← Volver</a></p>
  <div id="vista"><p class="cargando">Cargando…</p></div>
</main>
<footer id="pie"></footer>
<script type="module">
import { sb, $, $$, esc, toast, ocupado, param, armazon, requerirRol, fecha, fechaLarga, fechaHoraLarga, hoy, docsRequeridos, DOC_NOMBRE, DOC_CORTO, ESTADO_INFO, SEMAFORO_TXT, urlFirmada, subirArchivo, validarArchivo, rutaDocumento, mailto, whatsapp, ligaTramite, correoAcuse, correoPrevencion, correoFavorable, correoDesfavorable, correoAlta, correoAlSG, correoFinanzas, correoSeguimiento, correoEntrega, waAcuse, waPrevencion, waFavorable, waDesfavorable, waAlta, waSeguimiento, waEntrega, oficinaTexto, PAPELERIA_ORIGINAL, ROOT, CFG } from '../assets/app.js';
import { tarjetaDoc, activarTarjetas } from '../assets/docs-ui.js';
const p = await requerirRol(['cen_organizacion', 'cen_lectura', 'sg', 'finanzas', 'seccion_organizacion', 'seccion_sg']); if (!p) throw new Error('sin acceso');
const esSeccion = ['seccion_organizacion', 'seccion_sg'].includes(p.rol);
await armazon(esSeccion ? { titulo: p.secciones ? p.secciones.denominacion : 'Sección' } : { titulo: 'Organización del CEN', nav: [{ href: ROOT + 'cen/', texto: 'Bandeja', id: 'cen' }, { href: ROOT + 'sg/', texto: 'Autorizaciones', id: 'sg' }], activa: 'cen' });
$('#volver').href = esSeccion ? ROOT + 'seccion/' : ROOT + 'cen/';
const esOrg = p.rol === 'cen_organizacion'; const esSecOrg = p.rol === 'seccion_organizacion'; const puedeSubir = esOrg || esSecOrg; const revisa = esOrg || esSecOrg; const id = param('id'); const vista = $('#vista');
let s, docs, pad, correoSG = '', cfg = {}, segs = [];
const dd = (k, val) => `<dt>${k}</dt><dd>${val == null || val === '' ? '—' : val}</dd>`;
const enviar = (titulo, tel, correo, asunto, cuerpoCorreo, cuerpoWa, cc) => `<div class="envio"><span class="small"><b>${titulo}</b></span> <a class="btn wa chico" href="${whatsapp(tel, cuerpoWa)}" target="_blank" ${!tel ? 'style="opacity:.5;pointer-events:none"' : ''}>WhatsApp</a> <a class="btn secundario chico" href="${mailto(correo, asunto, cuerpoCorreo, cc)}">Correo</a></div>`;
await cargar();

async function cargar() {
  const [r1, r2, r3, r4, r5, r6] = await Promise.all([
    sb.from('v_solicitudes').select('*').eq('id', id).single(),
    sb.from('solicitud_documentos').select('*').eq('solicitud_id', id).order('created_at'),
    sb.from('v_padron').select('*').eq('solicitud_id', id).maybeSingle(),
    esSeccion ? Promise.resolve({ data: [] }) : sb.from('usuarios_roles').select('email').eq('rol', 'sg').eq('activo', true).not('email', 'like', '%@sitad.test').limit(1),
    esSeccion ? Promise.resolve({ data: [] }) : sb.from('configuracion').select('clave, valor'),
    sb.from('solicitud_seguimientos').select('*').eq('solicitud_id', id).order('created_at', { ascending: false }),
  ]);
  if (r1.error || !r1.data) { vista.innerHTML = `<div class="aviso error">No se encontró la solicitud.</div>`; return; }
  s = r1.data; docs = r2.data || []; pad = r3.data; correoSG = r4.data && r4.data[0] ? r4.data[0].email : ''; s.documentos = docs; segs = r6.data || [];
  cfg = Object.fromEntries((r5.data || []).map(x => [x.clave, x.valor]));
  render();
}
function render() {
  const cerrada = ['Ejecutada en padrón', 'Dictaminada desfavorable', 'Desistida'].includes(s.estado);
  const abierta = ['Recibida', 'Prevenida', 'Subsanada'].includes(s.estado);
  const req = docsRequeridos(s.actividad_transporte);
  const existentes = {}; docs.forEach(d => existentes[d.tipo + '|' + (d.parte || '')] = d);
  const presente = d => d.partes ? d.partes.every(([pt]) => existentes[d.tipo + '|' + pt]) : !!existentes[d.tipo + '|'];
  const faltan = req.filter(d => !presente(d));
  const alertas = [];
  if (s.con_novedad) alertas.push('NOVEDAD: la persona o la Sección subió documentos después de la última revisión. Revísalos y marca "Revisado".');
  if (s.es_confianza) alertas.push('La persona declaró desempeñar funciones de confianza. Verifica antes de dictaminar: los trabajadores de confianza legalmente excluidos no pueden afiliarse.');
  if (s.duplicado) alertas.push('Posible duplicado: hay otra solicitud viva o un afiliado activo con la misma CURP o el mismo correo. Si es la misma persona, no se abre nuevo trámite: responde indicando el folio existente.');
  if (!s.documentos_completos && !cerrada) alertas.push(`Expediente incompleto: faltan ${faltan.map(d => d.corto).join(', ')}.`);
  if (s.fuera_de_plazo) alertas.push('Esta solicitud está fuera del plazo estatutario. Atiéndela hoy.');
  const dep = Array.isArray(s.dependientes) ? s.dependientes : [];
  const q = `id=${s.id}`; const tel = s.telefono; const pv = correoPrevencion(s, faltantesGuardados());
  const padC = pad ? { ...pad, seccion: s.seccion, seccion_numero: s.seccion_numero, asamblea_fecha_hora: s.asamblea_fecha_hora, asamblea_direccion: s.asamblea_direccion, convocatoria_url: s.convocatoria_url, oficina_domicilio: s.oficina_domicilio, oficina_horario: s.oficina_horario, oficina_contacto_nombre: s.oficina_contacto_nombre, oficina_contacto_telefono: s.oficina_contacto_telefono } : null;
  const firmaSec = esSeccion ? `Secretaría de Organización · ${s.seccion} · SITAD` : null;
  vista.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem">
    <div><p class="small muted mb-0">${esc(s.seccion)}${s.seccion_numero ? ' (Sección ' + s.seccion_numero + ')' : ' (sin número: folio por clave ' + esc(s.seccion_clave) + ')'} · ${s.canal === 'publico' ? 'capturada por la persona desde la liga' : 'registrada por la Sección'} · ${esc(s.tipo_movimiento)}</p>
      <h1>${esc(s.folio)} <span class="etiqueta ${(ESTADO_INFO[s.estado] || {}).etiqueta || ''}">${esc(s.estado)}</span>${s.con_novedad ? ' <span class="etiqueta novedad">novedad</span>' : ''}</h1>
      <p class="mb-0"><b>${esc(s.nombre_completo)}</b> · <span class="punto ${s.semaforo}"></span>${esc(SEMAFORO_TXT[s.semaforo] || '')}${s.actividad_transporte ? ' · <span class="etiqueta azul">transporte: 8 documentos</span>' : ''}</p>
      <p class="small mb-0">📱 ${esc(tel || 'sin teléfono')} ${tel ? `<a class="btn wa chico" href="${whatsapp(tel, 'Hola, ' + s.nombre_completo.split(' ')[0] + '. Te escribimos de la Secretaría de Organización del SITAD sobre tu solicitud de afiliación, folio ' + s.folio + '.')}" target="_blank">WhatsApp</a>` : ''} · ✉ <a href="${mailto(s.correo, 'SITAD · Folio ' + s.folio, '')}">${esc(s.correo)}</a></p></div>
    <div class="small muted" style="text-align:right">Recibida el ${fechaLarga(s.fecha_recepcion)}<br>Límite para dictaminar: <b>${fecha(s.limite_dictamen)}</b>${s.limite_ejecucion ? `<br>Límite para ejecutar el alta: <b>${fecha(s.limite_ejecucion)}</b>` : ''}${s.asamblea_fecha_hora ? `<br>Asamblea constitutiva: <b>${esc(fechaHoraLarga(s.asamblea_fecha_hora))}</b>` : ''}</div>
  </div>
  ${alertas.map(a => `<div class="aviso ${/fuera del plazo|duplicado|confianza/.test(a) ? 'error' : /NOVEDAD/.test(a) ? '' : 'atencion'} small">${esc(a)}</div>`).join('')}

  <div class="ficha mt-2">
    <div>
      <div class="tarjeta">
        <h3>Expediente (${req.filter(presente).length} de ${req.length}) <span class="tiny muted">· se revisa aquí mismo, documento por documento</span></h3>
        <p class="small muted">Formatos prellenados con los datos capturados: <a href="${ROOT}documento.html?tipo=solicitud&${q}" target="_blank">Anexo 12 y 13</a> · <a href="${ROOT}documento.html?tipo=cedula&${q}" target="_blank">Anexo 23</a>.</p>
        <div class="visor" id="visor">${req.map(d => (d.partes ? d.partes : [[null, null]]).map(([pt, nombrePt]) => { const x = existentes[d.tipo + '|' + (pt || '')]; const titulo = esc(d.nombre) + (nombrePt ? ' · ' + esc(nombrePt) : ''); return `
          <div class="visor-doc" data-docid="${x ? x.id : ''}" data-tipo="${d.tipo}" data-parte="${pt || ''}">
            <div class="visor-cab"><span><span class="punto ${x ? (x.validado === false ? 'amarillo' : x.validado ? 'verde' : 'azul') : 'rojo'}"></span><b>${titulo}</b>${x ? `<span class="tiny muted"> · ${esc(x.nombre_archivo || '')} · ${fecha(x.created_at)}</span>` : ' <span class="tiny rojo">Falta</span>'}</span>
              <span>${x ? `<a href="#" class="btn discreto chico" data-abrir="${x.id}">Abrir en pestaña</a>` : ''}${puedeSubir && abierta ? `<label class="btn discreto chico" style="cursor:pointer">${x ? 'Reemplazar' : 'Subir'}<input type="file" class="oculto" data-subir="${d.tipo}" data-parte="${pt || ''}" accept="application/pdf,image/jpeg,image/png"></label>` : ''}</span></div>
            ${x ? `<div class="visor-cuerpo" data-ver="${x.id}"><span class="cargando" style="color:#ddd">Cargando documento…</span></div>` : ''}
            ${x && revisa && abierta ? `<div class="visor-pie"><button class="btn ${x.validado ? 'verde' : 'secundario'} chico" data-ok="${x.id}">${x.validado ? '✓ Correcto' : 'Marcar correcto'}</button><textarea data-obs="${x.id}" placeholder="Observación para la persona (qué está mal y cómo debe venir). Se muestra en su consulta y entra en el seguimiento.">${esc(x.observacion || '')}</textarea><button class="btn secundario chico" data-guardar-obs="${x.id}">Guardar observación</button></div>` : x && x.observacion ? `<div class="visor-pie small" style="color:var(--ambar)"><b>Observación:</b> ${esc(x.observacion)}</div>` : ''}
          </div>`; }).join('')).join('')}</div>
        ${s.expediente_url ? `<p class="small mt-2">Expediente definitivo en Drive: <a href="${esc(s.expediente_url)}" target="_blank">${esc(s.expediente_url)}</a></p>` : ''}
      </div>

      <div class="tarjeta">
        <h3>Datos capturados <span class="tiny muted">(Anexo 23 y manifestación)</span></h3>
        <dl class="datos">
          ${dd('CURP · RFC', esc(s.curp || '—') + ' · ' + esc(s.rfc || '—'))}${dd('Nacimiento · género · estado civil', fecha(s.fecha_nacimiento) + ' · ' + esc(s.genero || '—') + ' · ' + esc(s.estado_civil || '—'))}
          ${dd('Domicilio', [s.domicilio, s.colonia, s.cp ? 'C.P. ' + s.cp : '', s.municipio, s.estado_domicilio].filter(Boolean).map(esc).join(', '))}
          ${dd('Seguridad social', 'NSS ' + esc(s.nss || '—') + ' · ' + esc(s.unidad_medica || '—') + (s.unidad_medica_ciudad ? ', ' + esc(s.unidad_medica_ciudad) : ''))}
          ${dd('Situación profesional', esc(s.escolaridad || '—') + (s.escolaridad_estado ? ' (' + esc(s.escolaridad_estado) + ')' : '') + ' · ' + esc(s.carrera || '—'))}
          ${dd('Empresa', esc(s.empresa) + ' · ' + esc(s.puesto || '—') + (s.fecha_inicio_relacion ? ' · ingreso ' + fecha(s.fecha_inicio_relacion) : '') + ' · ' + esc(s.frecuencia_pago || '—'))}
          ${dd('Domicilio fiscal · contacto', esc(s.domicilio_fiscal || '—') + ' · ' + esc(s.telefono_empresa || '—') + ' · ' + esc(s.jefe_laboral || '—'))}
          ${dd('Seguro del instrumento', esc(s.seguro_aseguradora || '—') + ' · ' + esc(s.seguro_poliza || '—') + ' · ' + esc(s.seguro_vigencia || '—'))}
          ${dd('Cónyuge', s.conyuge_nombre ? esc(s.conyuge_nombre) + ' · ' + esc(s.conyuge_domicilio || '') + ' · ' + esc(s.conyuge_telefono || '') : 'No aplica')}
          ${dd('Dependientes', dep.length ? dep.map(x => esc(x.nombre) + ' (' + esc(x.parentesco || '') + (x.edad != null ? ', ' + x.edad + ' años' : '') + ')').join('; ') : 'No aplica')}
          ${dd('Manifestación', 'Se identifica con ' + esc(s.identificacion_tipo || '—') + ' · patrón ' + esc(s.patron || '—') + ' · firma en ' + esc(s.ciudad_firma || '—'))}
          ${dd('Declaraciones', (s.acepta_estatuto ? 'Acepta Estatutos y Documentos Básicos (' + fecha(s.acepta_estatuto_at) + ')' : '<span class="rojo">NO aceptó los Estatutos</span>') + ' · ' + (s.es_confianza ? '<span class="rojo">declara funciones de confianza</span>' : 'no es de confianza') + ' · aviso de privacidad ' + (s.aviso_privacidad_at ? fecha(s.aviso_privacidad_at) : '—') + ' · ' + (s.actividad_transporte ? 'transporte de pasajeros / última milla' : 'no es transporte'))}
        </dl>
        ${esOrg && !cerrada ? `<div class="acciones"><button class="btn discreto chico" id="a-transporte">${s.actividad_transporte ? 'Quitar la marca de transporte' : 'Marcar como transporte (pide 3 documentos más)'}</button></div>` : ''}
      </div>

      <div class="tarjeta">
        <h3>Seguimiento a la persona <span class="tiny muted">(cuantas veces haga falta; la persona lo ve en su consulta)</span></h3>
        ${segs.length ? `<ol class="linea-tiempo">${segs.map(g => { const pts = g.puntos || []; const firma = g.origen === 'seccion' ? 'Secretaría de Organización · ' + s.seccion + ' · SITAD' : undefined; const wa = g.tipo === 'prevencion' ? waPrevencion(s, pts) : waSeguimiento(s, pts, firma); const co = g.tipo === 'prevencion' ? correoPrevencion(s, pts) : correoSeguimiento(s, pts, firma); return `<li class="hecho"><b>${g.tipo === 'prevencion' ? 'Prevención formal' : g.tipo === 'mensaje' ? 'Mensaje' : 'Seguimiento'}${g.origen === 'seccion' ? ' (Sección)' : ' (CEN)'} · ${fechaLarga(g.fecha)}</b><span>${pts.length ? pts.map((x, i) => (i + 1) + '. ' + esc(x)).join('<br>') : esc(g.texto || '')}</span>${!esSeccion || true ? `<div class="mt-1"><a class="btn wa chico" href="${whatsapp(tel, wa)}" target="_blank" ${!tel ? 'style="opacity:.5;pointer-events:none"' : ''}>WhatsApp</a> <a class="btn secundario chico" href="${mailto(s.correo, co.asunto, co.cuerpo)}">Correo</a></div>` : ''}</li>`; }).join('')}</ol>` : '<p class="small muted">Todavía no hay seguimientos.</p>'}
        ${revisa && abierta ? `<div class="acciones"><button class="btn secundario" id="a-seguimiento">Pedir corrección / dar seguimiento</button><span class="small muted">Se arma con lo que falta y tus observaciones; luego lo envías por WhatsApp o correo.</span></div>` : ''}
      </div>
      ${esOrg ? `<div class="tarjeta">
        <h3>Mensaje para la persona <span class="tiny muted">(lo ve en "Consultar mi trámite")</span></h3>
        <textarea id="mensaje">${esc(s.mensaje_publico || '')}</textarea>
        <div class="acciones"><button class="btn secundario chico" id="guardar-mensaje">Guardar mensaje</button><span class="small muted">Sirve para avisos puntuales de este folio. Los faltantes se comunican con la prevención.</span></div>
      </div>
      <div class="tarjeta">
        <h3>Notas internas</h3>
        <textarea id="notas">${esc(s.notas || '')}</textarea>
        <div class="acciones"><button class="btn secundario chico" id="guardar-notas">Guardar notas</button></div>
      </div>` : ''}
    </div>

    <div class="lateral">
      <div class="tarjeta">
        <h3>Trámite</h3>
        <ol class="linea-tiempo">
          <li class="hecho"><b>Recibida</b><span>${fechaLarga(s.fecha_recepcion)} · límite para prevenir ${fecha(s.limite_prevencion)}</span></li>
          ${s.fecha_prevencion ? `<li class="hecho"><b>Prevenida</b><span>${fechaLarga(s.fecha_prevencion)} · plazo para subsanar ${fecha(s.limite_subsanacion)}</span></li>` : ''}
          ${s.fecha_subsanacion ? `<li class="hecho"><b>Subsanada</b><span>${fechaLarga(s.fecha_subsanacion)} · nuevo límite de dictamen ${fecha(s.limite_dictamen)}</span></li>` : ''}
          <li class="${s.fecha_dictamen ? 'hecho' : ''}"><b>Dictamen ${s.sentido ? '· ' + esc(s.sentido) : ''}</b><span>${s.fecha_dictamen ? fechaLarga(s.fecha_dictamen) : 'Pendiente · límite ' + fecha(s.limite_dictamen)}</span></li>
          ${s.sentido === 'Favorable' || s.fecha_envio_sg ? `<li class="${s.fecha_envio_sg ? 'hecho' : ''}"><b>Enviada al Secretario General</b><span>${s.fecha_envio_sg ? fechaLarga(s.fecha_envio_sg) : 'Pendiente'}</span></li>` : ''}
          ${s.sentido === 'Favorable' ? `<li class="${s.fecha_autorizacion_sg ? 'hecho' : ''}"><b>Autorización del SG</b><span>${s.fecha_autorizacion_sg ? fechaLarga(s.fecha_autorizacion_sg) + (s.autorizacion_sg_ref ? ' · ' + esc(s.autorizacion_sg_ref) : '') : 'Pendiente'}</span></li>` : ''}
          ${s.sentido === 'Favorable' ? `<li class="${s.fecha_ejecucion_padron ? 'hecho' : ''}"><b>Alta en el Padrón</b><span>${s.fecha_ejecucion_padron ? fechaLarga(s.fecha_ejecucion_padron) + (pad ? ' · No. ' + pad.numero_afiliacion : '') : 'Automática al autorizar el SG'}</span></li>` : ''}
          ${pad ? `<li class="${pad.entrega_at ? 'hecho' : ''}"><b>Entrega en oficina</b><span>${pad.entrega_at ? fechaLarga(String(pad.entrega_at).slice(0, 10)) + ' · papelería en resguardo y credencial entregada' : 'Pendiente: la persona pasa a la oficina de su Sección'}</span></li>` : ''}
        </ol>
      </div>
      <div class="tarjeta" id="acciones-caja"><h3>Acciones</h3>${accionesHtml(cerrada)}</div>
      ${pad ? `<div class="tarjeta" id="entrega-caja">
        <h3>Entrega en oficina <span class="tiny muted">(credencial y número de afiliado)</span></h3>
        ${pad.entrega_at ? `<div class="aviso ok small"><b>Entregada</b> el ${fechaLarga(String(pad.entrega_at).slice(0, 10))} en ${esc(pad.entrega_lugar || 'la Sección')}: papelería en original recibida y resguardada; credencial No. ${pad.numero_afiliacion} entregada.${pad.entrega_nota ? '<br>' + esc(pad.entrega_nota) : ''}</div>${esOrg ? `<button class="btn discreto chico" id="e-anular">Anular la entrega (registrada por error)</button>` : ''}` : `
        <p class="small">La persona debe presentarse en la oficina de la ${esc(s.seccion)} con su papelería <b>en original</b> (solicitud y cédula firmadas, INE, CURP, constancia fiscal). La Sección la coteja contra el expediente digital, la resguarda físicamente, le entrega su credencial con su número de afiliado y le explica cómo trabaja la Sección.</p>
        <p class="tiny muted">${esc(oficinaTexto(padC, s))}</p>
        ${(esOrg || esSeccion) ? `<div class="envio"><span class="small"><b>Recordarle que pase a la oficina</b></span> <a class="btn wa chico" href="${whatsapp(tel, waEntrega(padC, s, firmaSec))}" target="_blank" ${!tel ? 'style="opacity:.5;pointer-events:none"' : ''}>WhatsApp</a> <a class="btn secundario chico" href="${mailto(s.correo, correoEntrega(padC, s, firmaSec).asunto, correoEntrega(padC, s, firmaSec).cuerpo)}">Correo</a></div>
        <p class="tiny"><a href="${ROOT}documento.html?tipo=credencial&id=${pad.id}" target="_blank">Credencial para imprimir (No. ${pad.numero_afiliacion})</a></p>
        <label class="casilla small"><input type="checkbox" id="e-papeleria"> Recibí la papelería en original, la cotejé y queda en resguardo físico de la Sección</label>
        <label class="casilla small"><input type="checkbox" id="e-credencial"> Entregué la credencial con el número de afiliado ${pad.numero_afiliacion}</label>
        <div class="campo mt-1"><label for="e-nota" class="small">Nota (opcional)</label><input type="text" id="e-nota" placeholder="Ej. Se le explicó el funcionamiento de la Sección; se entregó copia del Estatuto"></div>
        <button class="btn verde" id="e-registrar">✓ Registrar entrega en oficina</button>` : '<p class="small muted">Pendiente: la persona no ha pasado a la oficina.</p>'}`}
      </div>` : ''}
      <div class="tarjeta">
        <h3>Enviar a la persona <span class="tiny muted">(plantillas del SG · WhatsApp o correo)</span></h3>
        ${enviar('1 · Acuse de recepción', tel, s.correo, correoAcuse(s).asunto, correoAcuse(s).cuerpo, waAcuse(s))}
        ${s.fecha_prevencion ? enviar('2 · Prevención (faltantes + liga para corregir)', tel, s.correo, pv.asunto, pv.cuerpo, waPrevencion(s, faltantesGuardados())) + `<p class="tiny"><a href="${ROOT}documento.html?tipo=prevencion&${q}" target="_blank">FT-002 · Prevención (imprimir)</a></p>` : ''}
        ${s.fecha_dictamen && s.sentido === 'Favorable' ? enviar('3 · Dictamen favorable', tel, s.correo, correoFavorable(s).asunto, correoFavorable(s).cuerpo, waFavorable(s)) : ''}
        ${s.fecha_dictamen && s.sentido === 'Desfavorable' ? enviar('4 · Dictamen desfavorable', tel, s.correo, correoDesfavorable(s).asunto, correoDesfavorable(s).cuerpo, waDesfavorable(s)) : ''}
        ${s.fecha_dictamen ? `<p class="tiny"><a href="${ROOT}documento.html?tipo=dictamen&${q}" target="_blank">FT-001 · Dictamen (imprimir)</a>${s.sentido === 'Favorable' && !s.fecha_autorizacion_sg && !esSeccion ? ` · <a href="${mailto(correoSG, correoAlSG([s]).asunto, correoAlSG([s]).cuerpo)}">Remitir al Secretario General</a>` : ''}</p>` : ''}
        ${padC ? (pad.alta_enviada_at ? `<div class="aviso ok small">Alta enviada el ${fechaLarga(String(pad.alta_enviada_at).slice(0, 10))}${pad.alta_enviada_medio ? ' por ' + esc(pad.alta_enviada_medio) : ''}.</div>` : `<div class="aviso small"><b>Alta autorizada por el SG: carta de aceptación por enviar.</b> Manda el paso 5 (cita a la persona en la oficina de su Sección) y pulsa "Marcar como enviada".</div>`) + (!s.oficina_domicilio ? `<div class="aviso atencion small">La ${esc(s.seccion)} <b>no ha capturado su oficina de atención</b> (domicilio, horario, persona y teléfono). La carta dirá que la Sección la contactará. ${esSeccion ? 'Captúrala en tu portal, pestaña Directorio.' : 'Pídeselo a la Sección o captúralo en Secciones.'}</div>` : '') + enviar(s.asamblea_fecha_hora ? '5 · Carta de aceptación e información para la asamblea' : '5 · Carta de aceptación (cita en la oficina de la Sección)', tel, s.correo, correoAlta(padC, s).asunto, correoAlta(padC, s).cuerpo, waAlta(padC, s)) + (esOrg && !pad.alta_enviada_at ? `<div class="acciones" style="margin:.3rem 0"><button class="btn verde chico" id="a-enviada-wa">✓ Marcar como enviada por WhatsApp</button><button class="btn secundario chico" id="a-enviada-correo">✓ Marcar como enviada por correo</button></div>` : '') + `
          <p class="tiny"><b>Adjunta a ese mensaje:</b> <a href="${ROOT}documento.html?tipo=constancia&id=${pad.id}" target="_blank">Constancia (Anexo 15)</a>${s.asamblea_fecha_hora ? ` · <a href="${ROOT}documento.html?tipo=gafete&id=${pad.id}" target="_blank">Gafete (Anexo 14)</a>` : ''}. Descárgalos en PDF con el botón del documento. <b>No se envían</b> la credencial ni el número de afiliado: se entregan en persona (tarjeta "Entrega en oficina").</p>
          ${!esSeccion && pad.entrega_at ? enviar('6 · Cuota sindical (carta AF-09)', tel, s.correo, correoFinanzas(padC, cfg).asunto, correoFinanzas(padC, cfg).cuerpo, correoFinanzas(padC, cfg).cuerpo) + `<p class="tiny"><a href="${mailto(CFG.CORREO_FINANZAS, 'SITAD · Alta en el Padrón · ' + pad.folio, correoAlta(padC, s).finanzas)}">Aviso interno a Finanzas</a></p>` : !esSeccion ? `<p class="tiny muted">6 · La carta de Finanzas (AF-09) lleva el número de afiliado: se envía cuando la persona ya recogió su credencial.</p>` : ''}` : ''}
        <p class="tiny muted mt-2">WhatsApp abre WhatsApp Web o la app con el número de la persona y el mensaje ya escrito; tú solo pulsas enviar. Los correos se abren en tu programa de correo hasta que exista el buzón institucional.</p>
      </div>
    </div>
  </div>`;
  enlazar(cerrada, abierta, req);
  cargarVisores();
}

function faltantesGuardados() { const m = /\[PREVENCION\]([\s\S]*?)\[\/PREVENCION\]/.exec(s.notas || ''); return m ? m[1].trim().split('\n').filter(Boolean) : ['Ver oficio de prevención.']; }

function accionesHtml(cerrada) {
  const abierta = ['Recibida', 'Prevenida', 'Subsanada'].includes(s.estado);
  const pre = s.preautorizada_at ? `<div class="aviso ok small"><b>Preautorizada por la Sección</b> el ${fechaLarga(String(s.preautorizada_at).slice(0, 10))}${s.preautorizacion_nota ? ': ' + esc(s.preautorizacion_nota) : ''}.</div>` : (abierta ? `<div class="aviso atencion small"><b>En revisión seccional.</b> La Sección revisa el expediente, pide correcciones y preautoriza; entonces pasa al CEN.</div>` : '');
  if (esSecOrg) {
    const b = [];
    if (abierta && !s.preautorizada_at) b.push(`<button class="btn verde" id="a-preautorizar">Preautorizar y enviar al CEN</button><p class="tiny muted">Solo cuando el expediente esté completo, cada documento revisado y sin observaciones pendientes.</p>`);
    if (abierta && s.preautorizada_at) b.push(`<p class="small muted">Ya la preautorizaste; está con la Secretaría de Organización del CEN. Si detectas algo, escríbeles por el seguimiento.</p>`);
    return pre + `<div class="acciones" style="flex-direction:column;align-items:stretch">${b.join('')}</div><p class="small muted">Como Sección revisas el expediente, subes o reemplazas documentos por la persona, le pides correcciones por WhatsApp o correo y preautorizas. El dictamen y el alta los lleva el CEN.</p>`;
  }
  if (!esOrg) return pre + `<p class="small muted">Solo lectura.</p>`;
  const b = [];
  if (s.con_novedad) b.push(`<button class="btn secundario" id="a-revisado">Marcar como revisado (quitar novedad)</button>`);
  if (cerrada) { b.push(`<p class="small muted">Trámite concluido.</p>`); return pre + `<div class="acciones" style="flex-direction:column;align-items:stretch">${b.join('')}</div>`; }
  if (abierta && !s.preautorizada_at) b.push(`<button class="btn secundario" id="a-preautorizar">Preautorizar yo mismo (saltar la revisión seccional)</button>`);
  if (abierta && s.preautorizada_at) b.push(`<button class="btn secundario" id="a-regresar">Regresar a la Sección (con motivo)</button>`);
  if (['Recibida', 'Subsanada'].includes(s.estado)) {
    if (!s.fecha_prevencion) b.push(`<button class="btn secundario" id="a-prevenir">Prevenir: pedir lo que falta (una sola vez)</button>`);
    b.push(`<button class="btn" id="a-favorable">Validar: dictamen FAVORABLE → al Secretario General</button>`, `<button class="btn secundario" id="a-desfavorable">Dictaminar desfavorable</button>`);
  }
  if (s.estado === 'Prevenida') b.push(`<button class="btn" id="a-subsanada">Registrar subsanación recibida</button>`, `<button class="btn secundario" id="a-desfavorable">Dictaminar desfavorable (no subsanó)</button>`);
  if (s.estado === 'Dictaminada favorable') b.push(`<button class="btn" id="a-enviar-sg">Marcar como enviada al SG</button>`);
  if (s.estado === 'Enviada al SG') b.push(`<p class="small muted">En espera de la autorización del Secretario General (desde ${fecha(s.fecha_envio_sg)}). Al autorizar, el alta en el Padrón es automática y aquí aparecen la constancia, el gafete y la carta de Finanzas listos para enviar. Si te la comunica por otro medio:</p><button class="btn secundario" id="a-autorizacion-externa">Registrar autorización recibida por otro medio</button>`);
  if (s.estado === 'Autorizada' && !pad) b.push(`<button class="btn verde" id="a-alta">Ejecutar alta en el Padrón</button>`);
  b.push(`<button class="btn discreto chico" id="a-desistir">Registrar desistimiento</button>`);
  return pre + `<div class="acciones" style="flex-direction:column;align-items:stretch">${b.join('')}</div>`;
}

async function cargarVisores() {
  for (const caja of $$('[data-ver]')) {
    const d = docs.find(x => x.id === caja.dataset.ver); if (!d) continue;
    try {
      const u = await urlFirmada(d.archivo_url, 1800); const esPdf = /\.pdf(\?|$)/i.test(d.archivo_url) || /pdf/i.test(d.nombre_archivo || '');
      caja.innerHTML = esPdf ? `<iframe src="${u}#toolbar=0&view=FitH" title="${esc(d.nombre_archivo || '')}"></iframe>` : `<img src="${u}" alt="${esc(d.nombre_archivo || '')}" loading="lazy">`;
    } catch (e) { caja.innerHTML = `<span class="small" style="color:#f88">No se pudo mostrar: ${esc(e.message || e)}</span>`; }
  }
}

function enlazar(cerrada, abierta, req) {
  $$('[data-abrir]').forEach(a => a.onclick = async e => { e.preventDefault(); const d = docs.find(x => x.id === a.dataset.abrir); try { window.open(await urlFirmada(d.archivo_url), '_blank'); } catch (err) { toast('No se pudo abrir: ' + err.message, 'error'); } });
  $$('[data-ok]').forEach(b => b.onclick = async () => { const d = docs.find(x => x.id === b.dataset.ok); const { error } = await sb.from('solicitud_documentos').update({ validado: !d.validado, observacion: d.validado ? d.observacion : null }).eq('id', d.id); if (error) toast(error.message, 'error'); else cargar(); });
  $$('[data-guardar-obs]').forEach(b => b.onclick = async () => { const idd = b.dataset.guardarObs; const o = $(`[data-obs="${idd}"]`).value.trim(); const { error } = await sb.from('solicitud_documentos').update({ observacion: o || null, validado: o ? false : null }).eq('id', idd); if (error) toast(error.message, 'error'); else { toast(o ? 'Observación guardada; la persona la ve en su consulta.' : 'Observación borrada.', 'ok'); cargar(); } });
  $$('[data-subir]').forEach(inp => inp.onchange = async () => { const f = inp.files[0]; const err = validarArchivo(f); if (err) return toast(err, 'error'); const parte = inp.dataset.parte || null; try {
      const ruta = rutaDocumento(s.seccion_slug, s.folio, inp.dataset.subir + (parte ? '-' + parte : ''), f.name).replace(/(\.[a-z0-9]+)$/i, `-${Date.now()}$1`); await subirArchivo(ruta, f);
      const prev = docs.find(x => x.tipo === inp.dataset.subir && (x.parte || null) === parte); if (prev) { const { error: e0 } = await sb.from('solicitud_documentos').delete().eq('id', prev.id); if (e0) throw e0; }
      const { error } = await sb.from('solicitud_documentos').insert({ solicitud_id: s.id, tipo: inp.dataset.subir, parte, archivo_url: ruta, nombre_archivo: f.name }); if (error) throw error;
      if (s.estado === 'Prevenida' && !s.fecha_subsanacion) await sb.from('solicitudes_afiliacion').update({ fecha_subsanacion: hoy() }).eq('id', s.id);
      toast('Documento guardado.', 'ok'); cargar(); } catch (e) { toast('No se pudo subir: ' + (e.message || e), 'error'); } });
  const on = (i, fn) => { const b = $('#' + i); if (b) b.onclick = fn; };
  on('guardar-notas', () => actualizar({ notas: $('#notas').value }, 'Notas guardadas.'));
  on('guardar-mensaje', () => actualizar({ mensaje_publico: $('#mensaje').value.trim() || null }, 'Mensaje guardado; la persona lo ve en su consulta.'));
  on('a-revisado', () => actualizar({ revisado_at: new Date().toISOString() }, 'Marcada como revisada.'));
  on('a-transporte', () => actualizar({ actividad_transporte: !s.actividad_transporte }, 'Marca de transporte actualizada; el expediente se recalculó.'));
  on('a-prevenir', () => prevenir(req)); on('a-seguimiento', () => seguimiento(req)); on('a-favorable', favorable);
  on('a-preautorizar', async () => { if (!confirm(`Preautorizar la solicitud ${s.folio} de ${s.nombre_completo}: confirmas que revisaste cada documento, que están completos, legibles y firmados con tinta azul, y que los datos coinciden con la INE. Pasa a la Secretaría de Organización del CEN.`)) return; const nota = prompt('Nota para el CEN (opcional):', '') ?? ''; const { error } = await sb.rpc('preautorizar_seccion', { p_id: s.id, p_nota: nota }); if (error) return toast('No se pudo preautorizar: ' + error.message, 'error'); toast('Preautorizada. Ya está en la bandeja del CEN.', 'ok'); cargar(); });
  on('a-regresar', async () => { const motivo = prompt('Motivo para regresarla a la Sección (la Sección lo ve en el seguimiento):'); if (!motivo) return; const { error } = await sb.rpc('regresar_a_seccion', { p_id: s.id, p_motivo: motivo }); if (error) return toast('No se pudo regresar: ' + error.message, 'error'); toast('Regresada a la Sección.', 'ok'); cargar(); });
  on('e-registrar', registrarEntrega); on('e-anular', anularEntrega); on('a-enviada-wa', () => marcarEnviada('WhatsApp')); on('a-enviada-correo', () => marcarEnviada('correo')); on('a-desfavorable', desfavorable); on('a-subsanada', () => actualizar({ fecha_subsanacion: hoy() }, 'Subsanación registrada; el plazo se reanuda.'));
  on('a-enviar-sg', () => actualizar({ fecha_envio_sg: hoy() }, 'Marcada como enviada al SG.', true));
  on('a-autorizacion-externa', () => { const ref = prompt('¿Cómo autorizó el Secretario General? (oficio, correo o mensaje y fecha). Queda como referencia de la autorización.'); if (!ref) return; const f = prompt('Fecha de la autorización (aaaa-mm-dd):', hoy()); if (!f) return; sb.rpc('registrar_autorizacion_externa', { p_id: s.id, p_fecha: f, p_ref: ref }).then(({ error }) => { if (error) toast('No se pudo registrar: ' + error.message, 'error'); else { toast('Autorización registrada; el alta se ejecutó en automático.', 'ok'); cargar(); } }); });
  on('a-alta', alta); on('a-desistir', () => { if (!confirm('¿Registrar desistimiento? La solicitud queda sin efectos.')) return; actualizar({ fecha_dictamen: hoy(), sentido: 'Desistimiento' }, 'Desistimiento registrado.'); });
}

async function actualizar(cambios, msg, abrirSG) {
  const { error } = await sb.from('solicitudes_afiliacion').update(cambios).eq('id', s.id);
  if (error) return toast('No se pudo guardar: ' + error.message, 'error');
  toast(msg, 'ok'); await cargar();
  if (abrirSG) window.open(mailto(correoSG, correoAlSG([s]).asunto, correoAlSG([s]).cuerpo), '_blank');
}
function puntosSugeridos(req) {
  const existentes = {}; docs.forEach(d => existentes[d.tipo + '|' + (d.parte || '')] = d);
  const faltan = [];
  for (const d of req) { if (d.partes) { for (const [pt, n] of d.partes) if (!existentes[d.tipo + '|' + pt]) faltan.push(`${d.nombre}: falta ${n.toLowerCase()}`); } else if (!existentes[d.tipo + '|']) faltan.push(d.nombre); }
  const conObs = docs.filter(d => d.observacion && d.validado !== true).map(d => `${DOC_NOMBRE[d.tipo] || d.tipo}${d.parte ? ' (' + d.parte + ')' : ''}: ${d.observacion}`);
  return [...faltan.map(f => `Falta: ${f}; súbalo por el medio institucional indicando su folio.`), ...conObs];
}
async function prevenir(req) {
  const texto = prompt('PREVENCIÓN FORMAL (una sola vez; fija plazo de 10 días hábiles). Puntos, uno por renglón (se numeran PRIMERO, SEGUNDO…). Se toman de lo que falta y de las observaciones que anotaste en cada documento. Puedes editar:', puntosSugeridos(req).join('\n'));
  if (!texto || !texto.trim()) return;
  const puntos = texto.split('\n').map(x => x.trim()).filter(Boolean);
  const notas = (s.notas || '').replace(/\[PREVENCION\][\s\S]*?\[\/PREVENCION\]\n?/, '') + `\n[PREVENCION]\n${puntos.join('\n')}\n[/PREVENCION]`;
  const { error } = await sb.from('solicitudes_afiliacion').update({ fecha_prevencion: hoy(), notas: notas.trim(), revisado_at: new Date().toISOString() }).eq('id', s.id);
  if (error) return toast('No se pudo registrar: ' + error.message, 'error');
  await sb.from('solicitud_seguimientos').insert({ solicitud_id: s.id, tipo: 'prevencion', puntos });
  await cargar(); toast('Prevención registrada. Ahora envíala con los botones WhatsApp o Correo (paso 2).', 'ok');
  document.querySelector('.lateral .tarjeta:last-child')?.scrollIntoView({ behavior: 'smooth' });
}
async function seguimiento(req) {
  const texto = prompt('SEGUIMIENTO (se puede hacer cuantas veces haga falta; no fija plazo nuevo). Puntos a corregir, uno por renglón. Puedes editar:', puntosSugeridos(req).join('\n'));
  if (!texto || !texto.trim()) return;
  const puntos = texto.split('\n').map(x => x.trim()).filter(Boolean);
  const { error } = await sb.from('solicitud_seguimientos').insert({ solicitud_id: s.id, tipo: 'seguimiento', puntos });
  if (error) return toast('No se pudo registrar: ' + error.message, 'error');
  await cargar(); toast('Seguimiento registrado. Envíalo con WhatsApp o Correo desde la tarjeta "Seguimiento a la persona".', 'ok');
}
async function registrarEntrega() {
  const pap = $('#e-papeleria').checked, cred = $('#e-credencial').checked;
  if (!pap || !cred) return toast('Marca las dos casillas: papelería en original recibida y credencial entregada.', 'error');
  if (!confirm(`Registrar la entrega en oficina de ${s.nombre_completo} (No. ${pad.numero_afiliacion}): papelería en resguardo y credencial entregada. ¿Confirmas?`)) return;
  const { error } = await sb.rpc('registrar_entrega_presencial', { p_padron: pad.id, p_papeleria: true, p_credencial: true, p_nota: $('#e-nota').value || null });
  if (error) return toast('No se pudo registrar: ' + error.message, 'error');
  toast('Entrega registrada. El trámite queda concluido.', 'ok'); cargar();
}
async function anularEntrega() {
  if (!confirm('¿Anular la entrega registrada? Volverá a aparecer como pendiente.')) return;
  const { error } = await sb.rpc('anular_entrega_presencial', { p_padron: pad.id });
  if (error) return toast('No se pudo anular: ' + error.message, 'error');
  toast('Entrega anulada.', 'ok'); cargar();
}
async function marcarEnviada(medio) {
  const { error } = await sb.rpc('marcar_alta_enviada', { p_padron: pad.id, p_medio: medio });
  if (error) return toast('No se pudo marcar: ' + error.message, 'error');
  toast('Alta marcada como enviada por ' + medio + '.', 'ok'); cargar();
}
async function favorable() {
  const req = [];
  if (!s.documentos_completos) req.push('el expediente no está completo');
  if (docs.some(d => d.validado === false)) req.push('hay documentos con observación sin corregir');
  if (s.es_confianza) req.push('la persona declaró funciones de confianza');
  if (s.duplicado) req.push('hay un posible duplicado');
  if (!s.acepta_estatuto) req.push('no aceptó los Estatutos');
  if (req.length && !confirm(`Atención: ${req.join('; ')}. ¿Dictaminar FAVORABLE de todos modos?`)) return;
  if (!confirm(`Dictaminar FAVORABLE la solicitud ${s.folio} de ${s.nombre_completo} y remitirla al Secretario General para que autorice el alta. ¿Confirmas?`)) return;
  const { error } = await sb.from('solicitudes_afiliacion').update({ fecha_dictamen: hoy(), sentido: 'Favorable', fecha_envio_sg: hoy(), revisado_at: new Date().toISOString() }).eq('id', s.id);
  if (error) return toast('No se pudo dictaminar: ' + error.message, 'error');
  await cargar(); toast('Dictamen favorable registrado y enviado al SG (aparece en su bandeja). Se abre el correo al SG; avisa a la persona con el paso 3.', 'ok');
  window.open(mailto(correoSG, correoAlSG([s]).asunto, correoAlSG([s]).cuerpo), '_blank');
}
async function desfavorable() {
  const motivo = prompt('Requisito no acreditado y motivo (tal como irá en el dictamen y en el mensaje a la persona):'); if (!motivo) return;
  if (!confirm(`Dictaminar DESFAVORABLE ${s.folio}. ¿Confirmas?`)) return;
  const { error } = await sb.from('solicitudes_afiliacion').update({ fecha_dictamen: hoy(), sentido: 'Desfavorable', motivo_desfavorable: motivo }).eq('id', s.id);
  if (error) return toast('No se pudo dictaminar: ' + error.message, 'error');
  await cargar(); toast('Dictamen desfavorable registrado. Envíalo con el paso 4.', 'ok');
}
async function alta() {
  if (!confirm(`Ejecutar el alta de ${s.nombre_completo} en el Padrón de Afiliados. ¿Confirmas?`)) return;
  const copia = {};
  for (const k of ['tipo_movimiento','nombre_completo','curp','rfc','fecha_nacimiento','estado_civil','genero','domicilio','colonia','cp','municipio','estado_domicilio','correo','telefono','nss','unidad_medica','unidad_medica_ciudad','escolaridad','escolaridad_estado','carrera','puesto','domicilio_fiscal','frecuencia_pago','telefono_empresa','jefe_laboral','seguro_aseguradora','seguro_poliza','seguro_vigencia','conyuge_nombre','conyuge_domicilio','conyuge_telefono','dependientes','identificacion_tipo','patron','actividad_transporte','ciudad_firma','centro_trabajo','empresa','fecha_inicio_relacion','fecha_dictamen','fecha_autorizacion_sg','autorizacion_sg_ref','expediente_url']) copia[k] = s[k];
  const { data, error } = await sb.from('padron').insert({ ...copia, folio: s.folio, solicitud_id: s.id, seccion_id: s.seccion_id, fecha_alta: hoy() }).select('id, numero_afiliacion').single();
  if (error) return toast('No se pudo dar el alta: ' + error.message, 'error');
  await cargar(); toast(`Alta ejecutada. Número de afiliación ${data.numero_afiliacion}.`, 'ok');
}
</script>

</html>
