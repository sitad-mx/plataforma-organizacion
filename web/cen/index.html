<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEN · Organización · SITAD</title>
<link rel="icon" href="../assets/sitad-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header id="cabecera"></header>
<main class="contenido">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem">
    <div><p class="small muted mb-0" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--rojo)">Comité Ejecutivo Nacional</p><h1>Secretaría de Organización</h1></div>
    <div id="resumen" class="small muted"></div>
  </div>
  <div class="pestanas" id="pestanas">
    <button data-p="solicitudes" class="activa">Solicitudes</button>
    <button data-p="padron">Padrón</button>
    <button data-p="secciones">Secciones</button>
    <button data-p="asambleas">Asambleas</button>
    <button data-p="tablero">Tablero</button>
    <button data-p="trimestre">Relación trimestral</button>
  </div>
  <section id="panel"><p class="cargando">Cargando…</p></section>
</main>
<footer id="pie"></footer>
<script type="module">
import { sb, $, $$, esc, toast, ocupado, param, armazon, requerirRol, fecha, fechaLarga, fechaHoraLarga, hoy, ESTADO_INFO, SEMAFORO_TXT, correoAlSG, mailto, ROOT, CFG } from '../assets/app.js';
const p = await requerirRol(['cen_organizacion', 'cen_lectura', 'sg', 'finanzas']); if (!p) throw new Error('sin acceso');
await armazon({ titulo: 'Organización del CEN', nav: [{ href: ROOT + 'cen/', texto: 'Bandeja', id: 'cen' }, { href: ROOT + 'sg/', texto: 'Autorizaciones', id: 'sg' }], activa: 'cen' });
const panel = $('#panel'); const esOrg = p.rol === 'cen_organizacion';
const PANELES = { solicitudes, padron, secciones, asambleas, tablero, trimestre };
$$('#pestanas button').forEach(b => b.onclick = () => { $$('#pestanas button').forEach(x => x.classList.remove('activa')); b.classList.add('activa'); history.replaceState(null, '', '?p=' + b.dataset.p); PANELES[b.dataset.p](); });
const inicial = param('p') && PANELES[param('p')] ? param('p') : 'solicitudes';
$$('#pestanas button').forEach(b => b.classList.toggle('activa', b.dataset.p === inicial)); PANELES[inicial]();

// ===== Solicitudes =====
// Los filtros y la posición se recuerdan en este navegador: al volver de una ficha la bandeja queda como se dejó (petición de Manuel 28-sep)
const FILTRO_KEY = 'cen_bandeja_filtro';
let filtro = { alcance: 'cen', texto: '', seccion: '' };
try { const g = JSON.parse(localStorage.getItem(FILTRO_KEY) || 'null'); if (g && g.alcance) filtro = { alcance: g.alcance, texto: g.texto || '', seccion: g.seccion || '' }; } catch {}
function recordarFiltro(extra) { try { const prev = JSON.parse(localStorage.getItem(FILTRO_KEY) || '{}'); localStorage.setItem(FILTRO_KEY, JSON.stringify({ ultimo: prev.ultimo, scroll: prev.scroll, ...filtro, ...extra })); } catch {} }
const ETAPA_TXT = { 'Revisión seccional': 'Sin revisar / con faltantes', 'Lista para el CEN': 'Lista para dictaminar' };
async function solicitudes() {
  panel.innerHTML = '<p class="cargando">Cargando solicitudes…</p>';
  const { data, error } = await sb.from('v_solicitudes').select('id, folio, nombre_completo, telefono, correo, seccion, seccion_slug, fecha_recepcion, estado, etapa, preautorizada_at, semaforo, fuera_de_plazo, dias_para_dictamen, dias_para_ejecutar, limite_dictamen, canal, duplicado, es_confianza, documentos_completos, con_novedad, alta_por_enviar, entrega_pendiente, fecha_dictamen, sentido, fecha_envio_sg, fecha_autorizacion_sg, fecha_prevencion, limite_subsanacion, fecha_subsanacion, correo_compartido').order('fecha_recepcion', { ascending: false }).limit(500);
  if (error) { panel.innerHTML = `<div class="aviso error">${esc(error.message)}</div>`; return; }
  const secciones = [...new Set(data.map(s => s.seccion))].sort();
  const porEnviar = data.filter(s => s.alta_por_enviar); const porEntregar = data.filter(s => s.etapa === 'Entrega en oficina');
  const activas = data.filter(s => !['Ejecutada en padrón', 'Dictaminada desfavorable', 'Desistida'].includes(s.estado) || s.alta_por_enviar);
  const enSeccion = activas.filter(s => s.etapa === 'Revisión seccional');
  const paraCEN = activas.filter(s => s.etapa !== 'Revisión seccional');
  const prevenidas = activas.filter(s => s.estado === 'Prevenida');
  const listas = paraCEN.filter(s => s.estado !== 'Prevenida'); // una prevenida espera a la persona: no está lista para dictaminar aunque ya se haya revisado
  const novedades = paraCEN.filter(s => s.con_novedad);
  const vencidas = activas.filter(s => s.fuera_de_plazo);
  const enRevision = enSeccion.filter(s => s.estado !== 'Prevenida'); // lo que el CEN tiene que revisar (recibidas o subsanadas); las prevenidas esperan a la persona
  $('#resumen').innerHTML = `<b style="color:var(--rojo)">${listas.length} por dictaminar</b> · ${novedades.length} con documentos nuevos · ${enRevision.length} en revisión · ${prevenidas.length} prevenidas · <b style="color:var(--verde)">${porEnviar.length} cartas por enviar</b> · <b style="color:var(--ambar)">${porEntregar.length} por atender en oficina</b>${vencidas.length ? ` · <b style="color:var(--rojo)">${vencidas.length} fuera de plazo</b>` : ''}`;
  const favorablesSinEnviar = data.filter(s => s.estado === 'Dictaminada favorable');
  const enviadas = data.filter(s => s.estado === 'Enviada al SG');
  panel.innerHTML = `
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem">
      <select id="f-alcance" title="De lo más urgente a lo menos"><option value="cen">1. Por dictaminar · expediente completo y revisado (${listas.length})</option><option value="novedades">2. Subieron documentos nuevos · hay que revisarlos (${novedades.length})</option><option value="seccional">3. En revisión · recibidas o subsanadas, sin resolver (${enRevision.length})</option><option value="prevenidas">4. Prevenidas · esperando a la persona (${prevenidas.length})</option><option value="enviar">5. Carta de aceptación por enviar (${porEnviar.length})</option><option value="entregar">6. Por atender en oficina · credencial y papelería (${porEntregar.length})</option><option value="todas">Todas (${data.length})</option></select>
      <select id="f-seccion"><option value="">Todas las secciones</option>${secciones.map(s => `<option>${esc(s)}</option>`).join('')}</select>
      <input type="text" id="f-texto" placeholder="Buscar por folio o nombre" style="max-width:260px">
      <span id="contador" class="etiqueta rojo" style="font-size:.95rem;padding:.35rem .7rem" title="Expedientes que cumplen los filtros de arriba"></span>
      <button class="btn secundario chico" id="excel" title="Descarga en Excel exactamente lo que está en la tabla, con correo, teléfono, plazos y lo que se le pidió a cada persona">⬇ Descargar Excel</button>
      ${esOrg ? `<a class="btn secundario chico" href="${ROOT}afiliate/" style="margin-left:auto">Registrar solicitud recibida por correo</a> <a class="btn discreto chico" href="${ROOT}cen/respaldo.html" title="Descarga una copia completa de la base de datos y los expedientes">💾 Respaldo</a>` : ''}
    </div>
    ${novedades.length ? `<div class="aviso small"><b>${novedades.length} solicitud(es) con documentos nuevos</b> desde tu última revisión: ${novedades.slice(0, 6).map(s => `<a href="solicitud.html?id=${s.id}">${esc(s.folio)}</a>`).join(', ')}${novedades.length > 6 ? '…' : ''}.</div>` : ''}
    ${porEnviar.length ? `<div class="aviso ok small"><b>${porEnviar.length} alta(s) en el Padrón con carta de aceptación por enviar:</b> ${porEnviar.slice(0, 6).map(s => `<a href="solicitud.html?id=${s.id}">${esc(s.folio)} · ${esc(s.nombre_completo)}</a>`).join(' · ')}${porEnviar.length > 6 ? '…' : ''}. Abre cada una, envía la carta de aceptación (cita en la oficina de su Sección) con un clic y márcala como enviada.</div>` : ''}
    ${porEntregar.length ? `<div class="aviso atencion small"><b>${porEntregar.length} persona(s) aceptada(s) no han pasado a la oficina de su Sección</b> por su credencial y su número de afiliado (filtro "Por atender en oficina"). La Sección registra la entrega cuando reciba la papelería en original.</div>` : ''}
    ${enviadas.length ? `<div class="aviso atencion small"><b>${enviadas.length} dictamen(es) favorable(s) esperan la autorización del Secretario General.</b> <a href="${mailto(await correoSG(), correoAlSG(enviadas).asunto, correoAlSG(enviadas).cuerpo)}">Recordárselo por correo</a> · <a href="${ROOT}sg/">Ver bandeja de autorizaciones</a></div>` : ''}
    <div class="tabla-envoltura"><table class="tabla"><thead><tr><th></th><th>Folio</th><th>Persona</th><th>Sección</th><th>Recibida</th><th>Etapa</th><th>Estado</th><th>Plazo</th></tr></thead><tbody id="filas"></tbody></table></div>`;
  $('#f-alcance').value = filtro.alcance; if (!$('#f-alcance').value) $('#f-alcance').value = 'cen'; // filtros viejos guardados (activas/vencidas/sg) ya no existen
  $('#f-seccion').value = filtro.seccion; $('#f-texto').value = filtro.texto;
  const pintar = () => {
    filtro = { alcance: $('#f-alcance').value, seccion: $('#f-seccion').value, texto: $('#f-texto').value.toLowerCase() };
    let lista = data;
    if (filtro.alcance === 'activas') lista = activas;
    if (filtro.alcance === 'cen') lista = listas;
    if (filtro.alcance === 'seccional') lista = enRevision;
    if (filtro.alcance === 'novedades') lista = novedades;
    if (filtro.alcance === 'revisar') lista = paraCEN.filter(s => ['Recibida', 'Subsanada'].includes(s.estado) && s.documentos_completos);
    if (filtro.alcance === 'prevenidas') lista = prevenidas;
    if (filtro.alcance === 'enviar') lista = porEnviar;
    if (filtro.alcance === 'entregar') lista = porEntregar;
    if (filtro.seccion) lista = lista.filter(s => s.seccion === filtro.seccion);
    if (filtro.texto) lista = lista.filter(s => (s.folio + ' ' + s.nombre_completo).toLowerCase().includes(filtro.texto));
    listaActual = lista;
    $('#contador').textContent = `${lista.length} expediente${lista.length === 1 ? '' : 's'}`;
    $('#filas').innerHTML = lista.length ? lista.map(s => `<tr class="clic" data-id="${s.id}">
      <td title="${esc(SEMAFORO_TXT[s.semaforo] || '')}"><span class="punto ${s.semaforo}"></span></td>
      <td><b>${esc(s.folio)}</b></td>
      <td>${esc(s.nombre_completo)}${s.con_novedad ? ' <span class="etiqueta novedad">novedad</span>' : ''}${s.alta_por_enviar ? ' <span class="etiqueta verde">carta por enviar</span>' : ''}${!s.alta_por_enviar && s.etapa === 'Entrega en oficina' ? ' <span class="etiqueta amarillo">por atender en oficina</span>' : ''}${s.es_confianza ? ' <span class="etiqueta rojo">confianza</span>' : ''}${s.duplicado ? ' <span class="etiqueta rojo" title="Misma CURP que otra solicitud viva o un afiliado activo">duplicado</span>' : ''}${s.correo_compartido ? ` <span class="etiqueta" title="Comparte el correo de contacto con ${esc(s.correo_compartido)}; no es un duplicado">mismo correo</span>` : ''}${!s.documentos_completos && !['Ejecutada en padrón','Dictaminada desfavorable','Desistida'].includes(s.estado) ? ' <span class="etiqueta amarillo">expediente incompleto</span>' : ''}<br><span class="tiny muted">📱 ${esc(s.telefono || '—')}</span></td>
      <td>${esc(s.seccion)}<br><span class="tiny muted">${s.canal === 'publico' ? 'por la liga' : 'por la Sección'}</span></td><td>${fecha(s.fecha_recepcion)}</td>
      <td><span class="etiqueta ${s.etapa === 'Lista para el CEN' ? 'rojo' : s.etapa === 'Revisión seccional' ? '' : s.etapa === 'Concluida' ? 'carbon' : 'azul'}">${esc(ETAPA_TXT[s.etapa] || s.etapa)}</span></td>
      <td><span class="etiqueta ${(ESTADO_INFO[s.estado] || {}).etiqueta || ''}">${esc(s.estado)}</span></td>
      <td>${plazo(s)}</td></tr>`).join('') : '<tr><td colspan="8" class="vacio">No hay solicitudes con ese filtro.</td></tr>';
    $$('#filas tr.clic').forEach(tr => tr.onclick = () => { recordarFiltro({ ultimo: tr.dataset.id, scroll: window.scrollY }); location.href = 'solicitud.html?id=' + tr.dataset.id; });
    recordarFiltro();
    // Al volver de una ficha: resaltar el expediente que se abrió y regresar a donde estaba la lista
    try { const g = JSON.parse(localStorage.getItem(FILTRO_KEY) || 'null'); if (g && g.ultimo && !pintar.restaurado) { pintar.restaurado = true; const tr = document.querySelector(`#filas tr[data-id="${g.ultimo}"]`); if (tr) { tr.classList.add('ultimo-visto'); requestAnimationFrame(() => { if (g.scroll) window.scrollTo(0, g.scroll); else tr.scrollIntoView({ block: 'center' }); }); } } } catch {}
  };
  ['f-alcance', 'f-seccion'].forEach(id => $('#' + id).onchange = pintar); $('#f-texto').oninput = pintar; pintar();
  $('#excel').onclick = () => descargarExcelSolicitudes(listaActual, $('#f-alcance').selectedOptions[0].textContent.replace(/^\d\. /, '').replace(/ \(\d+\)$/, ''), filtro.seccion);
}
let listaActual = [];
// Excel de la bandeja con los filtros puestos: para mandarlo a quien no tiene acceso a la plataforma (representantes de cada Sección) y que den seguimiento.
async function descargarExcelSolicitudes(lista, alcanceTxt, seccion) {
  if (!lista.length) { toast('No hay expedientes con ese filtro.', 'error'); return; }
  const btn = $('#excel'); ocupado(btn, true, 'Armando…');
  try {
    if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => no(new Error('No se pudo cargar la librería de Excel')); document.head.appendChild(s); });
    const ids = lista.map(s => s.id);
    const [{ data: segs }, { data: envs }] = await Promise.all([
      sb.from('solicitud_seguimientos').select('solicitud_id, tipo, puntos, texto, fecha').in('solicitud_id', ids).order('fecha', { ascending: false }),
      sb.from('solicitud_envios').select('solicitud_id, paso, medio, enviado_por_nombre, enviado_at').in('solicitud_id', ids).order('enviado_at', { ascending: false }),
    ]);
    const ultSeg = {}; (segs || []).forEach(g => { if (!ultSeg[g.solicitud_id]) ultSeg[g.solicitud_id] = g; });
    const prevs = {}; (segs || []).forEach(g => { if (g.tipo === 'prevencion' && !prevs[g.solicitud_id]) prevs[g.solicitud_id] = g; });
    const envPorSol = {}; (envs || []).forEach(e => { (envPorSol[e.solicitud_id] = envPorSol[e.solicitud_id] || []).push(e); });
    const PASO = { acuse: 'Acuse', prevencion: 'Prevención', seguimiento: 'Seguimiento', favorable: 'Dictamen favorable', desfavorable: 'Dictamen desfavorable', alta: 'Carta de aceptación', entrega: 'Recordatorio de entrega' };
    const f = d => d ? fecha(String(d).slice(0, 10)) : '';
    const puntos = g => g ? ((g.puntos || []).length ? g.puntos.map((p, i) => (i + 1) + '. ' + p).join('\n') : (g.texto || '')) : '';
    const filas = lista.map(s => { const pv = prevs[s.id]; const ug = ultSeg[s.id]; const ev = envPorSol[s.id] || []; const envPrev = ev.find(e => e.paso === 'prevencion'); const envUlt = ev[0];
      return {
        'Folio': s.folio, 'Persona': s.nombre_completo, 'Sección': s.seccion, 'Correo': s.correo || '', 'Teléfono': s.telefono || '',
        'Recibida': f(s.fecha_recepcion), 'Etapa': ETAPA_TXT[s.etapa] || s.etapa, 'Estado': s.estado,
        'Expediente completo': s.documentos_completos ? 'Sí' : 'No', 'Límite para dictaminar': f(s.limite_dictamen),
        'Prevenida el': f(s.fecha_prevencion), 'Límite para subsanar': f(s.limite_subsanacion), 'Subsanó el': f(s.fecha_subsanacion),
        'Qué se le pidió (prevención)': puntos(pv), 'Último mensaje registrado': ug ? `${ug.tipo === 'prevencion' ? 'Prevención' : ug.tipo === 'mensaje' ? 'Mensaje' : 'Seguimiento'} · ${f(ug.fecha)}` : '',
        'Prevención enviada': envPrev ? `${envPrev.medio} · ${f(envPrev.enviado_at)} · ${envPrev.enviado_por_nombre || ''}` : (pv ? 'Registrada, sin envío anotado' : ''),
        'Último envío': envUlt ? `${PASO[envUlt.paso] || envUlt.paso} · ${envUlt.medio} · ${f(envUlt.enviado_at)} · ${envUlt.enviado_por_nombre || ''}` : '',
        'Con novedad': s.con_novedad ? 'Sí' : '', 'Fuera de plazo': s.fuera_de_plazo ? 'Sí' : '', 'Canal': s.canal === 'publico' ? 'Por la liga' : 'Por la Sección',
        'Liga de consulta de la persona': `${ROOT}estado/?f=${encodeURIComponent(s.folio)}&c=${encodeURIComponent(s.correo || '')}`,
      }; });
    const ws = XLSX.utils.json_to_sheet(filas); const cols = Object.keys(filas[0]);
    ws['!cols'] = cols.map(c => ({ wch: c === 'Qué se le pidió (prevención)' ? 60 : c === 'Persona' || c === 'Liga de consulta de la persona' ? 36 : c === 'Correo' ? 30 : Math.max(12, c.length + 2) }));
    ws['!autofilter'] = { ref: XLSX.utils.encode_range(XLSX.utils.decode_range(ws['!ref'])) };
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Solicitudes');
    const nota = XLSX.utils.aoa_to_sheet([['Filtro', alcanceTxt], ['Sección', seccion || 'Todas'], ['Generado', fechaHoraLarga(new Date().toISOString())], ['Expedientes', String(lista.length)], ['Fuente', 'Plataforma de Organización SITAD · bandeja del CEN']]);
    XLSX.utils.book_append_sheet(wb, nota, 'Filtro');
    const limpio = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 40);
    XLSX.writeFile(wb, `solicitudes-${limpio(alcanceTxt)}${seccion ? '-' + limpio(seccion) : ''}-${hoy()}.xlsx`);
    toast(`Excel con ${lista.length} expediente(s) descargado.`, 'ok');
  } catch (e) { toast('No se pudo generar el Excel: ' + (e.message || e), 'error'); }
  ocupado(btn, false);
}
function plazo(s) {
  if (s.fuera_de_plazo) return '<span class="etiqueta rojo">Fuera de plazo</span>';
  if (s.dias_para_dictamen != null) return s.dias_para_dictamen <= 2 ? `<span class="etiqueta amarillo">Dictaminar en ${s.dias_para_dictamen} día(s)</span>` : `<span class="small muted">Dictamen: ${fecha(s.limite_dictamen)}</span>`;
  if (s.dias_para_ejecutar != null) return `<span class="etiqueta ${s.dias_para_ejecutar <= 1 ? 'amarillo' : ''}">Alta en ${s.dias_para_ejecutar} día(s)</span>`;
  if (s.estado === 'Prevenida') return '<span class="small muted">Esperando subsanación</span>';
  if (s.estado === 'Enviada al SG') return `<span class="small muted">Con el SG desde ${fecha(s.fecha_envio_sg)}</span>`;
  return '';
}
async function correoSG() { const { data } = await sb.from('usuarios_roles').select('email').eq('rol', 'sg').eq('activo', true).not('email', 'like', '%@sitad.test').limit(1); return data && data[0] ? data[0].email : ''; }

// ===== Padrón =====
async function padron() {
  panel.innerHTML = '<p class="cargando">Cargando padrón…</p>';
  const { data, error } = await sb.from('v_padron').select('id, solicitud_id, numero_afiliacion, folio, nombre_completo, curp, seccion, fecha_alta, estatus, fecha_baja, causa_baja, correo, entrega_at, entrega_lugar').order('numero_afiliacion');
  if (error) { panel.innerHTML = `<div class="aviso error">${esc(error.message)}</div>`; return; }
  panel.innerHTML = `
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem"><input type="text" id="p-texto" placeholder="Buscar por nombre, folio o CURP" style="max-width:300px"><span class="small muted">${data.filter(x => x.estatus === 'Activo').length} activos · ${data.length} en total</span><button class="btn secundario chico" id="csv" style="margin-left:auto">Descargar CSV</button></div>
    <div class="tabla-envoltura"><table class="tabla"><thead><tr><th>No.</th><th>Folio</th><th>Persona</th><th>CURP</th><th>Sección</th><th>Alta</th><th>Estatus</th><th>Entrega en oficina</th><th></th></tr></thead><tbody id="p-filas"></tbody></table></div>`;
  const pintar = () => { const t = $('#p-texto').value.toLowerCase(); const l = data.filter(x => !t || (x.nombre_completo + x.folio + (x.curp || '')).toLowerCase().includes(t));
    $('#p-filas').innerHTML = l.length ? l.map(x => `<tr><td class="num">${x.numero_afiliacion}</td><td>${esc(x.folio)}</td><td>${esc(x.nombre_completo)}</td><td class="small">${esc(x.curp || '')}</td><td>${esc(x.seccion)}</td><td>${fecha(x.fecha_alta)}</td><td><span class="etiqueta ${x.estatus === 'Activo' ? 'verde' : x.estatus === 'Baja' ? 'carbon' : 'amarillo'}">${esc(x.estatus)}</span>${x.fecha_baja ? `<br><span class="tiny muted">${fecha(x.fecha_baja)} · ${esc(x.causa_baja)}</span>` : ''}</td>
      <td class="small">${x.entrega_at ? `<span class="etiqueta verde">Entregada</span> <span class="tiny muted">${fecha(String(x.entrega_at).slice(0, 10))} · ${esc(x.entrega_lugar || '')}</span>` : x.estatus === 'Activo' ? `<span class="etiqueta amarillo">Pendiente</span>${x.solicitud_id ? ` <a href="solicitud.html?id=${x.solicitud_id}" class="tiny">registrar</a>` : ''}` : '—'}</td>
      <td class="small"><a href="${ROOT}documento.html?tipo=constancia&id=${x.id}" target="_blank">Constancia</a> · <a href="${ROOT}documento.html?tipo=gafete&id=${x.id}" target="_blank">Gafete</a> · <a href="${ROOT}documento.html?tipo=finanzas&id=${x.id}" target="_blank">Carta Finanzas</a> · <a href="${ROOT}documento.html?tipo=credencial&id=${x.id}" target="_blank">Credencial</a>${esOrg && x.estatus === 'Activo' ? ` · <a href="#" data-baja="${x.id}">Baja</a>` : ''}</td></tr>`).join('') : '<tr><td colspan="9" class="vacio">Sin registros.</td></tr>';
    $$('[data-baja]').forEach(a => a.onclick = e => { e.preventDefault(); baja(data.find(x => x.id === a.dataset.baja)); }); };
  $('#p-texto').oninput = pintar; pintar();
  $('#csv').onclick = () => descargarCSV('padron-' + hoy() + '.csv', data, ['numero_afiliacion', 'folio', 'nombre_completo', 'curp', 'seccion', 'fecha_alta', 'estatus', 'entrega_at', 'entrega_lugar', 'fecha_baja', 'causa_baja']);
}
function baja(x) {
  const causa = prompt(`Baja de ${x.nombre_completo} (${x.folio}).\nEscribe la causa exactamente: Separación voluntaria / Terminación de la relación de trabajo / Confianza / Expulsión / Fallecimiento`);
  if (!causa) return;
  const ref = prompt('Referencia de la autorización del Secretario General (oficio, fecha o "acuerdo verbal del dd/mm/aaaa"):'); if (ref === null) return;
  sb.from('padron').update({ estatus: 'Baja', fecha_baja: hoy(), causa_baja: causa.trim(), notas: `Baja autorizada por el SG: ${ref}` }).eq('id', x.id).then(({ error }) => { if (error) toast('No se registró la baja: ' + error.message, 'error'); else { toast('Baja registrada.', 'ok'); padron(); } });
}

// ===== Secciones =====
async function secciones() {
  panel.innerHTML = '<p class="cargando">Cargando secciones…</p>';
  const { data, error } = await sb.from('v_secciones').select('id, numero, clave, liga_activa, denominacion, entidad, slug, situacion, semaforo, afiliados_adscritos, cargos_vigentes, solicitudes_en_tramite, entregas_pendientes, asamblea_fecha_hora, ultimo_contacto, dias_sin_contacto, notas, oficina_domicilio, oficina_horario, oficina_contacto_nombre, oficina_contacto_telefono').order('denominacion');
  if (error) { panel.innerHTML = `<div class="aviso error">${esc(error.message)}</div>`; return; }
  panel.innerHTML = `<p class="small muted">La <b>liga de afiliación</b> de cada Sección es la que se comparte a los trabajadores; está activa en las Secciones constituidas o en constitución. El número de Sección lo asigna el CEN en el acuerdo de creación; mientras no exista, el folio usa la clave de entidad. La <b>oficina de atención</b> es donde la persona aceptada entrega su papelería en original y recibe su credencial; la captura la propia Sección (Directorio) o tú aquí.</p>
    <div class="tabla-envoltura"><table class="tabla"><thead><tr><th>No. · clave</th><th>Sección</th><th>Situación</th><th>Afiliados · en trámite</th><th>Cargos vigentes</th><th>Liga de afiliación</th><th>Oficina de atención</th></tr></thead><tbody>
    ${data.map(s => `<tr><td class="num">${s.numero ?? '—'}<br><span class="tiny muted">${esc(s.clave)}</span></td><td><b>${esc(s.denominacion)}</b><br><span class="tiny muted">${esc((s.notas || '').slice(0, 110))}${(s.notas || '').length > 110 ? '…' : ''}</span></td><td><span class="etiqueta ${s.situacion === 'Constituida' ? 'verde' : s.situacion === 'Acuerdo del CEN' ? 'azul' : ''}">${esc(s.situacion)}</span>${s.asamblea_fecha_hora ? '<br><span class="tiny muted">constitutiva ' + esc(fechaHoraLarga(s.asamblea_fecha_hora)) + '</span>' : ''}</td><td class="num">${s.afiliados_adscritos} · ${s.solicitudes_en_tramite}</td><td class="num">${s.cargos_vigentes} / 12</td>
      <td class="small">${s.liga_activa ? `<code>${ROOT}afiliate/?s=${s.slug}</code> <button class="btn discreto chico" data-copiar="${ROOT}afiliate/?s=${s.slug}">Copiar</button>` : '<span class="muted">Inactiva (sin acuerdo ni constitución)</span>'}</td><td class="small">${s.oficina_domicilio ? `${esc(s.oficina_domicilio)}${s.oficina_horario ? '<br><span class="tiny muted">' + esc(s.oficina_horario) + '</span>' : ''}${s.oficina_contacto_nombre || s.oficina_contacto_telefono ? '<br><span class="tiny muted">' + esc(s.oficina_contacto_nombre || '') + ' ' + esc(s.oficina_contacto_telefono || '') + '</span>' : ''}` : '<span class="etiqueta amarillo">sin capturar</span>'}${s.entregas_pendientes ? `<br><span class="tiny" style="color:var(--ambar)">${s.entregas_pendientes} por atender</span>` : ''}${esOrg ? ` <button class="btn discreto chico" data-oficina="${s.id}">Editar</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  $$('[data-oficina]').forEach(b => b.onclick = async () => { const s = data.find(x => x.id === b.dataset.oficina);
    const dom = prompt(`Oficina de atención de ${s.denominacion}.\nDomicilio (calle, número, colonia, ciudad):`, s.oficina_domicilio || ''); if (dom === null) return;
    const hor = prompt('Horario de atención:', s.oficina_horario || ''); if (hor === null) return;
    const nom = prompt('Persona que atiende (nombre y cargo):', s.oficina_contacto_nombre || ''); if (nom === null) return;
    const tel = prompt('Teléfono de esa persona (10 dígitos):', s.oficina_contacto_telefono || ''); if (tel === null) return;
    const { error } = await sb.rpc('actualizar_oficina_seccion', { p_seccion: s.id, p_domicilio: dom, p_horario: hor, p_nombre: nom, p_telefono: tel }); if (error) toast(error.message, 'error'); else { toast('Oficina guardada.', 'ok'); secciones(); } });
  $$('[data-copiar]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copiar).then(() => toast('Liga copiada.', 'ok')));
}


// ===== Asambleas (Módulo 3) =====
const ETIQ_AS = { 'En preparación': '', Convocada: 'azul', Instalada: 'verde', Concluida: 'carbon', 'Sin quórum': 'rojo', Cancelada: 'carbon' };
function filaAsamblea(x) {
  return `<tr class="clic" data-as="${x.id}"><td>${fecha(x.fecha)}<br><span class="tiny muted">${String(x.hora).slice(0, 5)} h</span></td><td><b>${esc(x.tipo)}</b>${x.incluye_eleccion ? ' <span class="tiny muted">· con elección</span>' : ''}<br><span class="tiny muted">${esc(x.lugar || '')}</span></td><td>${esc(x.seccion)}</td><td><span class="etiqueta ${ETIQ_AS[x.estado] || ''}">${esc(x.estado)}</span></td><td class="small">${x.corte_congelado_at ? `<b>${x.total_con_derecho}</b> al corte · quórum ${x.quorum_requerido}` : `corte ${fecha(x.corte_fecha)} · ${x.con_derecho_hoy} hoy`}</td><td class="small">${x.estado === 'Instalada' || x.estado === 'Concluida' || x.estado === 'Sin quórum' ? `${x.presentes} presentes` : (x.fecha_expedicion ? (x.anticipacion_cumple ? '<span class="etiqueta verde">anticipación ok</span>' : '<span class="etiqueta rojo">anticipación corta</span>') : '<span class="tiny muted">sin fecha de expedición</span>')}</td></tr>`;
}
async function asambleas() {
  panel.innerHTML = '<p class="cargando">Cargando…</p>';
  const { data, error } = await sb.from('v_asambleas').select('*').order('fecha', { ascending: false });
  if (error) { panel.innerHTML = `<div class="aviso error">${esc(error.message)}</div>`; return; }
  const proximas = data.filter(x => x.fecha >= hoy() && !['Concluida', 'Cancelada'].includes(x.estado));
  panel.innerHTML = `<div class="acciones" style="margin:0 0 1rem">${esOrg ? `<a class="btn" href="${ROOT}asambleas/">Convocar una asamblea</a>` : ''}<span class="small muted"><b>${proximas.length} próxima(s)</b> · ${data.length} en total. Las Secciones convocan sus ordinarias y extraordinarias; la Constitutiva la convoca Organización del CEN.</span></div>
    ${proximas.filter(x => x.fecha_expedicion && !x.anticipacion_cumple).map(x => `<div class="aviso error small"><b>${esc(x.seccion)} · ${esc(x.tipo)} del ${fecha(x.fecha)}:</b> la convocatoria no cumple la anticipación (${x.anticipacion_habiles} de ${x.anticipacion_requerida} días hábiles).</div>`).join('')}
    <div class="tabla-envoltura"><table class="tabla"><thead><tr><th>Fecha</th><th>Asamblea</th><th>Sección</th><th>Estado</th><th>Padrón al corte</th><th>Asistencia</th></tr></thead><tbody>${data.length ? data.map(filaAsamblea).join('') : '<tr><td colspan="6" class="vacio">Sin asambleas registradas.</td></tr>'}</tbody></table></div>`;
  $$('#panel tr.clic').forEach(tr => tr.onclick = () => location.href = `${ROOT}asambleas/?id=${tr.dataset.as}`);
}

// ===== Tablero =====
async function tablero() {
  panel.innerHTML = '<p class="cargando">Calculando indicadores…</p>';
  const { data, error } = await sb.from('v_tablero').select('*').order('bloque').order('orden');
  if (error) { panel.innerHTML = `<div class="aviso error">${esc(error.message)}</div>`; return; }
  const BLOQUES = { 1: 'Estructura territorial', 2: 'Funcionalidad seccional', 3: 'Afiliación', 4: 'Movimientos', 5: 'Incidencias', 6: 'Constituciones y asambleas', 7: 'Finanzas (cuotas)' };
  let html = `<p class="small muted">Fecha de corte: ${fechaLarga(hoy())}. Los indicadores se calculan solos a partir de la base.</p>`;
  for (const b of Object.keys(BLOQUES)) { const items = data.filter(x => x.bloque == b); if (!items.length) continue;
    html += `<div class="bloque-titulo">${b}. ${BLOQUES[b]}</div><div class="rejilla cuatro">${items.map(x => `<div class="cifra"><div class="valor ${/fuera de plazo|vencid|INTERVENCI/.test(x.indicador) && Number(x.valor) > 0 ? 'alerta' : ''}">${x.valor == null ? '—' : x.valor}${/\(%\)/.test(x.indicador) && x.valor != null ? '%' : ''}</div><div class="nombre" title="${esc(x.lectura)}">${esc(x.indicador.replace(' (%)', ''))}</div></div>`).join('')}</div>`; }
  panel.innerHTML = html;
}

// ===== Relación trimestral =====
async function trimestre() {
  const d = new Date(); const q = Math.ceil((d.getMonth() + 1) / 3); const a = d.getFullYear();
  const opciones = []; for (let i = 0; i < 6; i++) { let qq = q - i, aa = a; while (qq <= 0) { qq += 4; aa--; } opciones.push(`T${qq} ${aa}`); }
  panel.innerHTML = `<p class="small muted">Altas y bajas del trimestre para la relación que la Secretaría remite a Asuntos Jurídicos dentro de los cinco días hábiles siguientes al cierre.</p>
    <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem"><select id="t-sel">${opciones.map(o => `<option>${o}</option>`).join('')}</select><button class="btn secundario chico" id="t-csv">Descargar CSV</button></div><div id="t-res"></div>`;
  const cargar = async () => {
    const [t, anio] = $('#t-sel').value.split(' '); const n = parseInt(t.slice(1)); const ini = `${anio}-${String((n - 1) * 3 + 1).padStart(2, '0')}-01`; const fin = new Date(anio, n * 3, 0).toISOString().slice(0, 10);
    const [{ data: altas }, { data: bajas }] = await Promise.all([
      sb.from('v_padron').select('numero_afiliacion, folio, nombre_completo, curp, seccion, fecha_alta').gte('fecha_alta', ini).lte('fecha_alta', fin).order('fecha_alta'),
      sb.from('v_padron').select('numero_afiliacion, folio, nombre_completo, curp, seccion, fecha_baja, causa_baja').gte('fecha_baja', ini).lte('fecha_baja', fin).order('fecha_baja'),
    ]);
    const tabla = (titulo, filas, cols) => `<h3 class="mt-2">${titulo} (${filas.length})</h3><div class="tabla-envoltura"><table class="tabla"><thead><tr>${cols.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${filas.length ? filas.map(f => `<tr>${cols.map(c => `<td>${c[0].startsWith('fecha') ? fecha(f[c[0]]) : esc(f[c[0]] ?? '')}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="vacio">Ninguna.</td></tr>`}</tbody></table></div>`;
    $('#t-res').innerHTML = `<p class="small muted">Periodo: ${fechaLarga(ini)} al ${fechaLarga(fin)}.</p>` + tabla('Altas', altas || [], [['numero_afiliacion', 'No.'], ['folio', 'Folio'], ['nombre_completo', 'Persona'], ['curp', 'CURP'], ['seccion', 'Sección'], ['fecha_alta', 'Alta']]) + tabla('Bajas', bajas || [], [['numero_afiliacion', 'No.'], ['folio', 'Folio'], ['nombre_completo', 'Persona'], ['seccion', 'Sección'], ['fecha_baja', 'Baja'], ['causa_baja', 'Causa']]);
    $('#t-csv').onclick = () => descargarCSV(`relacion-${t}-${anio}.csv`, [...(altas || []).map(x => ({ movimiento: 'Alta', ...x })), ...(bajas || []).map(x => ({ movimiento: 'Baja', ...x }))], ['movimiento', 'numero_afiliacion', 'folio', 'nombre_completo', 'curp', 'seccion', 'fecha_alta', 'fecha_baja', 'causa_baja']);
  };
  $('#t-sel').onchange = cargar; cargar();
}
function descargarCSV(nombre, filas, cols) {
  const linea = f => cols.map(c => `"${String(f[c] ?? '').replace(/"/g, '""')}"`).join(',');
  const csv = '﻿' + cols.join(',') + '\n' + filas.map(linea).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = nombre; a.click();
}
</script>
</body>
</html>
