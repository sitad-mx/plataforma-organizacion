<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de la Sección · SITAD</title>
<link rel="icon" href="../assets/sitad-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header id="cabecera"></header>
<main class="contenido">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem">
    <div><p class="small muted mb-0" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--rojo)">Secretaría de Organización de la Sección</p><h1 id="titulo">Sección</h1></div>
    <div id="liga" class="small"></div>
  </div>
  <div class="pestanas" id="pestanas"><button data-p="solicitudes" class="activa">Solicitudes</button><button data-p="padron">Padrón adscrito</button><button data-p="directorio">Directorio</button><button data-p="guia">Cómo se hace</button><button onclick="location.href='../manual-seccion/'">📘 Manual de la Sección</button></div>
  <section id="panel"><p class="cargando">Cargando…</p></section>
</main>
<footer id="pie"></footer>
<script type="module">
import { sb, $, $$, esc, toast, armazon, requerirRol, fecha, fechaLarga, ESTADO_INFO, whatsapp, mailto, ligaTramite, waEntrega, correoEntrega, ROOT, CFG } from '../assets/app.js';
const p = await requerirRol(['seccion_organizacion', 'seccion_sg']); if (!p) throw new Error('sin acceso');
await armazon({ titulo: p.secciones ? p.secciones.denominacion : 'Sección' });
const sec = p.secciones; const esOrg = p.rol === 'seccion_organizacion'; const panel = $('#panel');
$('#titulo').textContent = sec ? sec.denominacion : 'Sección';
const liga = sec ? `${ROOT}afiliate/?s=${sec.slug}` : '';
$('#liga').innerHTML = liga ? `<b>Liga de afiliación de tu Sección:</b><br><code>${liga}</code> <button class="btn discreto chico" id="copiar">Copiar</button>` : '<span class="muted">Tu Sección aún no tiene liga activa.</span>';
const c = $('#copiar'); if (c) c.onclick = () => navigator.clipboard.writeText(liga).then(() => toast('Liga copiada. Compártela a los trabajadores de tu Sección.', 'ok'));
const P = { solicitudes, padron, directorio, guia };
$$('#pestanas button').forEach(b => b.onclick = () => { $$('#pestanas button').forEach(x => x.classList.remove('activa')); b.classList.add('activa'); P[b.dataset.p](); });
solicitudes();

async function solicitudes() {
  panel.innerHTML = '<p class="cargando">Cargando…</p>';
  const { data, error } = await sb.from('v_solicitudes').select('id, folio, nombre_completo, correo, telefono, fecha_recepcion, estado, etapa, preautorizada_at, documentos_completos, fecha_prevencion, limite_subsanacion, canal, fecha_ejecucion_padron, con_novedad').order('fecha_recepcion', { ascending: false });
  if (error) { panel.innerHTML = `<div class="aviso error">${esc(error.message)}</div>`; return; }
  const porRevisar = data.filter(s => s.etapa === 'Revisión seccional'); const porEntregar = data.filter(s => s.etapa === 'Entrega en oficina');
  const orden = [...porRevisar, ...porEntregar, ...data.filter(s => !['Revisión seccional', 'Entrega en oficina'].includes(s.etapa))];
  panel.innerHTML = `<div class="acciones" style="margin:0 0 1rem">${esOrg && liga ? `<a class="btn" href="${liga}">Registrar una solicitud recibida en la Sección</a>` : ''}<span class="small"><b style="color:var(--rojo)">${porRevisar.length} por revisar en tu Sección</b> · <b style="color:var(--ambar)">${porEntregar.length} por atender en oficina</b> · ${data.length} en total · pulsa una fila para revisar el expediente</span></div>
    ${porRevisar.length ? `<div class="aviso small"><b>Tu tarea:</b> abre cada solicitud "Revisión seccional", revisa documento por documento, pide correcciones por WhatsApp o correo si algo falta, y cuando esté todo bien pulsa <b>Preautorizar y enviar al CEN</b>. Guía completa: <a href="${ROOT}manual-seccion/">Manual de la Sección</a>.</div>` : ''}
    ${porEntregar.length ? `<div class="aviso atencion small"><b>${porEntregar.length} persona(s) ya aceptada(s) deben pasar a tu oficina</b> con su papelería en original para recibir su credencial y su número de afiliado. Abre la fila, recuérdaselo por WhatsApp si hace falta y, cuando venga, registra la entrega en la tarjeta "Entrega en oficina".</div>` : ''}
    <div class="tabla-envoltura"><table class="tabla"><thead><tr><th>Folio</th><th>Persona</th><th>Contacto</th><th>Recibida</th><th>Etapa</th><th>Expediente</th></tr></thead><tbody>${orden.length ? orden.map(s => `<tr class="clic" data-id="${s.id}"><td><b>${esc(s.folio)}</b>${s.con_novedad ? '<br><span class="etiqueta novedad">novedad</span>' : ''}</td><td>${esc(s.nombre_completo)}<br><span class="tiny muted">${s.canal === 'publico' ? 'se registró por la liga' : 'registrada por la Sección'}</span></td><td class="small">📱 ${esc(s.telefono || '—')} ${s.telefono ? `<a class="btn wa chico" href="${whatsapp(s.telefono, 'Hola, ' + s.nombre_completo.split(' ')[0] + '. Te escribimos de la Sección del SITAD sobre tu solicitud de afiliación (folio ' + s.folio + '). Consulta tu trámite y sube documentos aquí: ' + ligaTramite(s))}" target="_blank" onclick="event.stopPropagation()">WhatsApp</a>` : ''}<br><span class="tiny muted">${esc(s.correo)}</span></td><td>${fecha(s.fecha_recepcion)}</td><td><span class="etiqueta ${s.etapa === 'Revisión seccional' ? 'rojo' : s.etapa === 'Entrega en oficina' ? 'amarillo' : s.etapa === 'Concluida' ? 'carbon' : 'azul'}">${esc(s.etapa)}</span><br><span class="tiny muted">${esc(s.estado)}</span>${s.estado === 'Prevenida' ? `<br><span class="tiny" style="color:var(--ambar)">Debe subir lo que falta antes del ${fecha(s.limite_subsanacion)}</span>` : ''}</td><td>${s.documentos_completos ? '<span class="etiqueta verde">Completo</span>' : '<span class="etiqueta amarillo">Incompleto</span>'}</td></tr>`).join('') : '<tr><td colspan="6" class="vacio">Todavía no hay solicitudes de tu Sección.</td></tr>'}</tbody></table></div>
    <p class="small muted mt-2">Para completar el expediente, la persona entra a <a href="${ROOT}estado/">Consultar mi trámite</a> con su folio y su nombre. Tú puedes abrir cada solicitud, ver sus documentos, subirlos por ella y preautorizar. El dictamen y el alta los emite la Secretaría de Organización del CEN.</p>`;
  $$('#panel tr.clic').forEach(tr => tr.onclick = () => location.href = ROOT + 'cen/solicitud.html?id=' + tr.dataset.id);
}
async function padron() {
  panel.innerHTML = '<p class="cargando">Cargando…</p>';
  const { data, error } = await sb.from('v_padron').select('id, solicitud_id, numero_afiliacion, folio, nombre_completo, fecha_alta, estatus, puesto, centro_trabajo, entrega_at, entrega_lugar').order('numero_afiliacion');
  if (error) { panel.innerHTML = `<div class="aviso error">${esc(error.message)}</div>`; return; }
  panel.innerHTML = `<p class="small muted">Personas afiliadas adscritas a tu Sección según el Padrón de Afiliados (que lleva la Secretaría de Organización del CEN). La columna <b>Entrega en oficina</b> indica quién falta de pasar por su credencial y su número de afiliado con su papelería en original.</p><div class="tabla-envoltura"><table class="tabla"><thead><tr><th>No.</th><th>Folio</th><th>Persona</th><th>Puesto · centro de trabajo</th><th>Alta</th><th>Estatus</th><th>Entrega en oficina</th></tr></thead><tbody>${data.length ? data.map(x => `<tr class="${x.solicitud_id ? 'clic' : ''}" data-id="${x.solicitud_id || ''}"><td class="num">${x.numero_afiliacion}</td><td>${esc(x.folio)}</td><td>${esc(x.nombre_completo)}</td><td class="small">${esc(x.puesto || '')} · ${esc(x.centro_trabajo || '')}</td><td>${fecha(x.fecha_alta)}</td><td><span class="etiqueta ${x.estatus === 'Activo' ? 'verde' : 'carbon'}">${esc(x.estatus)}</span></td><td class="small">${x.entrega_at ? `<span class="etiqueta verde">Entregada</span> <span class="tiny muted">${fecha(String(x.entrega_at).slice(0, 10))}</span>` : x.estatus === 'Activo' ? `<span class="etiqueta amarillo">Pendiente</span>${x.solicitud_id ? ' <span class="tiny muted">abre la fila para registrarla</span>' : ''}` : '—'}</td></tr>`).join('') : '<tr><td colspan="7" class="vacio">Aún no hay personas afiliadas adscritas.</td></tr>'}</tbody></table></div>`;
  $$('#panel tr.clic').forEach(tr => tr.onclick = () => location.href = `${ROOT}cen/solicitud.html?id=${tr.dataset.id}`);
}
async function directorio() {
  panel.innerHTML = '<p class="cargando">Cargando…</p>';
  const { data, error } = await sb.from('cargos_seccionales').select('id, cargo, persona_nombre, estatus, periodo_inicio, periodo_fin, telefono, correo, contacto_validado').order('created_at');
  if (error) { panel.innerHTML = `<div class="aviso error">${esc(error.message)}</div>`; return; }
  const { data: of } = await sb.from('secciones').select('oficina_domicilio, oficina_horario, oficina_contacto_nombre, oficina_contacto_telefono').eq('id', p.seccion_id).single();
  const o = of || {};
  panel.innerHTML = `<div class="tarjeta mb-2"><h3>Oficina de atención de la Sección</h3><p class="small muted">Aquí acude cada persona aceptada a entregar su papelería en original y recibir su credencial y su número de afiliado. Estos datos van en la carta de aceptación que recibe la persona; si están vacíos, la carta dice que la Sección la contactará.</p>
    <div class="fila"><div class="campo"><label for="o-dom">Domicilio de la oficina</label><input type="text" id="o-dom" value="${esc(o.oficina_domicilio || '')}" placeholder="Calle, número, colonia, ciudad" ${esOrg ? '' : 'disabled'}></div><div class="campo"><label for="o-hor">Horario de atención</label><input type="text" id="o-hor" value="${esc(o.oficina_horario || '')}" placeholder="Ej. lunes a viernes de 10 a 17 h" ${esOrg ? '' : 'disabled'}></div></div>
    <div class="fila"><div class="campo"><label for="o-nom">Persona que atiende</label><input type="text" id="o-nom" value="${esc(o.oficina_contacto_nombre || '')}" placeholder="Nombre y cargo" ${esOrg ? '' : 'disabled'}></div><div class="campo"><label for="o-tel">Teléfono de esa persona</label><input type="tel" id="o-tel" value="${esc(o.oficina_contacto_telefono || '')}" placeholder="10 dígitos" ${esOrg ? '' : 'disabled'}></div></div>
    ${esOrg ? '<button class="btn" id="o-guardar">Guardar oficina de atención</button>' : ''}</div>
  <p class="small muted">Comité Ejecutivo Seccional y Comisión Seccional de Vigilancia. ${esOrg ? 'Puedes corregir teléfono y correo; los cambios de persona en un cargo se hacen con un movimiento documentado ante la Secretaría de Organización del CEN.' : ''}</p>
    <div class="tabla-envoltura"><table class="tabla"><thead><tr><th>Cargo</th><th>Persona</th><th>Estatus</th><th>Periodo</th><th>Teléfono</th><th>Correo</th>${esOrg ? '<th></th>' : ''}</tr></thead><tbody>${data.map(c => `<tr data-id="${c.id}"><td>${esc(c.cargo)}</td><td>${esc(c.persona_nombre || '—')}</td><td><span class="etiqueta ${c.estatus === 'Vigente' ? 'verde' : ''}">${esc(c.estatus)}</span>${c.contacto_validado === false ? '<br><span class="tiny" style="color:var(--ambar)">contacto pendiente de validar</span>' : ''}</td><td class="small">${c.periodo_inicio ? fecha(c.periodo_inicio) + ' – ' + fecha(c.periodo_fin) : '—'}</td><td>${esOrg ? `<input type="text" value="${esc(c.telefono || '')}" data-tel style="min-width:120px">` : esc(c.telefono || '')}</td><td>${esOrg ? `<input type="text" value="${esc(c.correo || '')}" data-correo style="min-width:180px">` : esc(c.correo || '')}</td>${esOrg ? '<td><button class="btn secundario chico" data-guardar>Guardar</button></td>' : ''}</tr>`).join('')}</tbody></table></div>`;
  const og = $('#o-guardar'); if (og) og.onclick = async () => { const { error } = await sb.rpc('actualizar_oficina_seccion', { p_seccion: p.seccion_id, p_domicilio: $('#o-dom').value, p_horario: $('#o-hor').value, p_nombre: $('#o-nom').value, p_telefono: $('#o-tel').value }); if (error) toast(error.message, 'error'); else toast('Oficina de atención guardada. Ya aparece en las cartas de aceptación.', 'ok'); };
  $$('[data-guardar]').forEach(b => b.onclick = async () => { const tr = b.closest('tr'); const { error } = await sb.from('cargos_seccionales').update({ telefono: tr.querySelector('[data-tel]').value || null, correo: tr.querySelector('[data-correo]').value || null, fecha_actualizacion: new Date().toISOString().slice(0, 10) }).eq('id', tr.dataset.id); if (error) toast(error.message, 'error'); else { toast('Contacto actualizado; queda pendiente de validar por el CEN.', 'ok'); directorio(); } });
}
function guia() {
  panel.innerHTML = `<div class="tarjeta" style="max-width:820px">
    <h2>Cómo afilia tu Sección</h2>
    <ol>
      <li><b>Comparte la liga de afiliación</b> de tu Sección a los trabajadores. Con ella cada persona llena su solicitud y sube sus cinco documentos; queda ligada a tu Sección automáticamente.</li>
      <li><b>O recibe la papelería tú</b> (en persona o por correo) y regístrala con el botón "Registrar una solicitud recibida en la Sección". Captura los datos tal como vienen en la solicitud firmada y sube los documentos.</li>
      <li><b>Cinco documentos, ninguno más:</b> solicitud de afiliación firmada (Anexo 12 y 13: manifestación y aviso de privacidad, dos firmas de puño y letra), cédula de afiliación firmada (Anexo 23, todos los campos), identificación oficial (INE) por ambos lados, constancia de la CURP y Constancia de Situación Fiscal del SAT. <b>No se pide recibo de nómina.</b> Si la actividad es transporte de pasajeros o última milla, además tarjeta de circulación, póliza de seguro y licencia de manejo. La solicitud y la cédula las entrega el sistema prellenadas: la persona las imprime, las firma y las sube.</li>
      <li><b>La Secretaría de Organización del CEN revisa y dictamina</b> en un máximo de diez días hábiles. Si falta algo, previene una sola vez; la persona (o tú) sube lo faltante en "Consultar mi trámite".</li>
      <li><b>El Secretario General autoriza el alta.</b> Organización registra a la persona en el Padrón y le envía su carta de aceptación con la Constancia de Registro y la cita en tu oficina.</li>
      <li><b>La persona pasa a tu oficina</b> con su papelería <b>en original</b> (solicitud y cédula firmadas, INE, CURP, constancia fiscal). La cotejas contra el expediente digital, la resguardas físicamente, le entregas su <b>credencial con su número de afiliado</b> (se imprime desde la ficha) y le explicas cómo trabaja la Sección y a quién acudir. Registras la entrega en la ficha, tarjeta "Entrega en oficina". Captura antes tu oficina de atención en la pestaña Directorio.</li>
    </ol>
    <p class="small muted">Dudas: ${CFG.CORREO_ORGANIZACION}</p></div>`;
}
</script>
</body>
</html>
